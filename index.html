  async addProvider(){
    const type=document.getElementById('p-type').value;
    const name=document.getElementById('p-name').value.trim()||PROVIDER_CATALOG[type].name;
    const base=document.getElementById('p-base').value.trim()||PROVIDER_CATALOG[type].base;
    const apiKey=document.getElementById('p-key').value.trim();
    const modelInput=document.getElementById('p-model').value.trim();
    const modelsRaw=document.getElementById('p-models').value.trim();
    const cap=document.getElementById('p-caps').value;
    const enabled=document.getElementById('p-enabled').value==='true';
    if(!apiKey && type!=='custom'){ UI.toast('API key required','err'); return; }
    if(!base && type==='custom'){ UI.toast('Base URL required','err'); return; }

    let model = modelInput;
    let models = modelsRaw ? modelsRaw.split(',').map(s=>s.trim()).filter(Boolean) : (model ? [model] : []);

    const p = { id:'p_'+Date.now(), type, name, base, apiKey, model:model||'', models, enabled,
      caps:{vision:cap==='vision',reasoning:cap==='reasoning',coding:cap==='coding'}, created:Date.now() };

    if(!model){
      UI.toast('Detecting free model…');
      try{
        const detected = await AIRequestManager.detectFreeModel(p);
        if(detected){
          p.model = detected;
          if(!models.length) p.models = [detected];
          else if(!models.includes(detected)) p.models.unshift(detected);
          UI.toast('Free model detected: '+detected,'ok');
        } else {
          UI.toast('Could not detect a free model. Please set one manually.','err');
        }
      }catch(e){
        UI.toast('Auto-detect failed: '+(e.message||'unknown'),'err');
      }
    }

    State.providers.push(p);
    if(!State.settings.defaultProvider){ State.settings.defaultProvider=p.id; State.settings.defaultModel=p.model||p.models[0]; }
    saveProviders(); saveSettings();
    this.renderBody(); Models.updatePill();
    UI.toast('Provider saved','ok');
  },
  async autoDetect(id){
    const p=State.providers.find(x=>x.id===id); if(!p) return;
    UI.toast('Detecting free model…');
    try{
      const detected = await AIRequestManager.detectFreeModel(p);
      if(detected){
        p.model = detected;
        if(!p.models) p.models=[];
        if(!p.models.includes(detected)) p.models.unshift(detected);
        saveProviders();
        if(State.settings.defaultProvider===p.id) State.settings.defaultModel=detected;
        saveSettings(); this.renderBody(); Models.updatePill();
        UI.toast('Free model set: '+detected,'ok');
      } else {
        UI.toast('No free model found. Set one manually.','err');
      }
    }catch(e){ UI.toast('Failed: '+(e.message||'unknown'),'err'); }
  },
  setDefault(id){
    State.settings.defaultProvider=id;
    const p=State.providers.find(x=>x.id===id);
    State.settings.defaultModel=p?.model||p?.models?.[0]||'';
    saveSettings(); this.renderBody(); Models.updatePill();
    UI.toast('Default provider set','ok');
  },
  toggle(id){ const p=State.providers.find(x=>x.id===id); if(!p) return; p.enabled=!p.enabled; saveProviders(); this.renderBody(); Models.updatePill(); },
  async test(id){
    const p=State.providers.find(x=>x.id===id); if(!p) return;
    UI.toast('Testing…');
    const r=await AIRequestManager.testConnection(p);
    if(r.ok) UI.toast('Connection OK'+(r.models.length?` · ${r.models.length} models`:'')+'','ok');
    else UI.toast('Failed: '+r.error,'err');
  },
  async testNew(){
    const type=document.getElementById('p-type').value;
    const base=document.getElementById('p-base').value.trim()||PROVIDER_CATALOG[type].base;
    const apiKey=document.getElementById('p-key').value.trim();
    const model=document.getElementById('p-model').value.trim();
    if(!apiKey){ UI.toast('Enter an API key first','err'); return; }
    UI.toast('Testing…');
    const r=await AIRequestManager.testConnection({type,base,apiKey,model,id:'tmp'});
    if(r.ok){
      UI.toast('Connection OK'+(r.models.length?` · ${r.models.length} models`:'')+'','ok');
      if(r.models.length){
        document.getElementById('p-models').value=r.models.slice(0,20).map(m=>m.id).join(',');
        if(!model){
          const free = r.models.map(m=>m.id).find(id=>/:free$/i.test(id)) || r.models[0].id;
          document.getElementById('p-model').value=free;
        }
      }
    } else UI.toast('Failed: '+r.error,'err');
  },
  remove(id){
    if(!confirm('Delete this provider?')) return;
    State.providers=State.providers.filter(p=>p.id!==id);
    if(State.settings.defaultProvider===id){ State.settings.defaultProvider=State.providers[0]?.id||null; State.settings.defaultModel=State.providers[0]?.model||null; }
    saveProviders(); saveSettings(); this.renderBody(); Models.updatePill();
    UI.toast('Provider deleted');
  },

  tab_models(){
    const p=State.providers.find(x=>x.id===State.settings.defaultProvider);
    if(!p) return `<div class="notice">Configure a provider first.</div>`;
    return `
      <div class="field"><label>Default provider</label>
        <select onchange="State.settings.defaultProvider=this.value;State.settings.defaultModel=null;saveSettings();Settings.renderBody()">
          ${State.providers.map(x=>`<option value="${x.id}" ${x.id===State.settings.defaultProvider?'selected':''}>${Security.esc(x.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Default model</label>
        <input value="${Security.esc(State.settings.defaultModel||'')}" onchange="State.settings.defaultModel=this.value;saveSettings();Models.updatePill()">
      </div>
      <div class="field"><label>Fallback model (optional)</label>
        <input value="${Security.esc(State.settings.fallbackModel||'')}" onchange="State.settings.fallbackModel=this.value;saveSettings()">
      </div>
      <button class="btn btn-ghost" onclick="Settings.fetchModels('${p.id}')">Fetch available models</button>
      <div id="model-fetch-result" class="hint" style="margin-top:8px"></div>`;
  },
  async fetchModels(id){
    const p=State.providers.find(x=>x.id===id); if(!p) return;
    document.getElementById('model-fetch-result').textContent='Fetching…';
    const models=await AIRequestManager.listModels(p);
    if(!models.length){ document.getElementById('model-fetch-result').textContent='No models returned.'; return; }
    p.models=models.map(m=>m.id); saveProviders();
    document.getElementById('model-fetch-result').innerHTML=`Found ${models.length}:<br>`+models.slice(0,40).map(m=>`<code>${Security.esc(m.id)}</code>`).join(', ');
  },

  tab_search(){
    return `
      <div class="field"><label>Search provider</label>
        <select onchange="State.settings.searchProvider=this.value;saveSettings()">
          <option value="tavily" ${State.settings.searchProvider==='tavily'?'selected':''}>Tavily</option>
          <option value="brave" ${State.settings.searchProvider==='brave'?'selected':''}>Brave Search</option>
          <option value="serper" ${State.settings.searchProvider==='serper'?'selected':''}>Serper (Google)</option>
        </select>
      </div>
      <div class="field"><label>Search API key</label>
        <input type="password" value="${Security.esc(State.settings.searchKey)}" onchange="State.settings.searchKey=this.value;saveSettings()">
        <div class="hint">Required for real web search. Stored locally in your browser.</div>
      </div>
      <div class="field"><label>Deep research</label>
        <select onchange="State.settings.deepResearch=this.value==='true';saveSettings()">
          <option value="false" ${!State.settings.deepResearch?'selected':''}>Quick</option>
          <option value="true" ${State.settings.deepResearch?'selected':''}>Deep Research</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="Settings.save()">Save</button>`;
  },

  tab_voice(){
    return `
      <div class="field"><label>Voice language</label>
        <select onchange="State.settings.voiceLang=this.value;saveSettings()">
          <option value="en-US" ${State.settings.voiceLang==='en-US'?'selected':''}>English (US)</option>
          <option value="en-GB" ${State.settings.voiceLang==='en-GB'?'selected':''}>English (UK)</option>
          <option value="hi-IN" ${State.settings.voiceLang==='hi-IN'?'selected':''}>Hindi</option>
          <option value="es-ES" ${State.settings.voiceLang==='es-ES'?'selected':''}>Spanish</option>
          <option value="fr-FR" ${State.settings.voiceLang==='fr-FR'?'selected':''}>French</option>
          <option value="de-DE" ${State.settings.voiceLang==='de-DE'?'selected':''}>German</option>
        </select>
      </div>
      <div class="notice">
        <b>Listen button</b><br>
        When you tap Listen on an AI reply, ZISHU AI strips markdown, emojis, code blocks, and symbols — it speaks only natural text. Tap Listen again to stop.
      </div>
      <button class="btn btn-ghost" onclick="Voice.speak('Hello, this is ZISHU AI.')">Test text-to-speech</button>`;
  },

  tab_memory(){
    return `
      <div class="notice">Memory is opt-in. ZISHU AI only uses facts you add here.</div>
      <div class="field"><label>Add a memory</label>
        <input id="mem-new" placeholder="e.g. Prefers Python and concise answers">
        <button class="btn btn-primary" style="margin-top:8px" onclick="Settings.addMemory()">Add</button>
      </div>
      <div style="margin-top:14px">
        ${State.settings.memory.length?State.settings.memory.map((m,i)=>`
          <div class="prov-card">
            <div class="pc-info"><div class="pc-meta" style="font-size:12px;color:var(--text)">${Security.esc(m)}</div></div>
            <div class="pc-acts"><button onclick="Settings.delMemory(${i})">Delete</button></div>
          </div>`).join(''):'<div class="hint">No memories yet.</div>'}
      </div>`;
  },
  addMemory(){ const v=document.getElementById('mem-new').value.trim(); if(!v) return; State.settings.memory.push(v); saveMemory(); this.renderBody(); UI.toast('Memory added','ok'); },
  delMemory(i){ State.settings.memory.splice(i,1); saveMemory(); this.renderBody(); },

  tab_appearance(){
    return `
      <div class="field"><label>Theme</label>
        <select onchange="State.settings.theme=this.value;saveSettings();applyTheme(this.value==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):this.value)">
          <option value="system" ${State.settings.theme==='system'?'selected':''}>System (follow device)</option>
          <option value="dark" ${State.settings.theme==='dark'?'selected':''}>Dark</option>
          <option value="light" ${State.settings.theme==='light'?'selected':''}>Light</option>
        </select>
        <div class="hint">System follows your device's light/dark preference automatically.</div>
      </div>
      <div class="field"><label>Workspace button in header</label>
        <select onchange="State.settings.showWorkspaceButton=this.value==='true';saveSettings();document.getElementById('ws-toggle-btn').style.display=(State.settings.showWorkspaceButton||State.workspace.open)?'flex':'none'">
          <option value="false" ${!State.settings.showWorkspaceButton?'selected':''}>Show only when artifact exists (recommended)</option>
          <option value="true" ${State.settings.showWorkspaceButton?'selected':''}>Always show</option>
        </select>
      </div>`;
  },

  tab_privacy(){
    return `<div style="font-size:13px;line-height:1.7;color:var(--muted)">
      <p><b style="color:var(--text)">Where your data lives</b><br>
      Conversations, settings, and API keys are stored in your browser's IndexedDB on this device. They are never uploaded to ZISHU TRON servers.</p>
      <p style="margin-top:10px"><b style="color:var(--text)">API keys</b><br>
      Keys are sent only to the AI provider you configured. ZISHU AI itself does not receive them.</p>
      <p style="margin-top:10px"><b style="color:var(--text)">Web search</b><br>
      When enabled, your query is sent to the search provider you selected.</p>
      <p style="margin-top:10px"><b style="color:var(--text)">Sharing chats</b><br>
      Share links use the chat ID in the URL. Because data lives in your browser, another device will only see the chat if it has the same browser data (e.g. same device, or after you export/import).</p>
      <button class="btn btn-danger" style="margin-top:12px" onclick="Settings.wipeAll()">Clear all local data</button>
    </div>`;
  },
  async wipeAll(){
    if(!confirm('Delete ALL conversations, providers, and settings? This cannot be undone.')) return;
    await Storage.del('chats'); await Storage.del('providers'); await Storage.del('settings'); await Storage.del('memory');
    localStorage.clear();
    location.reload();
  },

  tab_about(){
    return `<div style="font-size:13px;line-height:1.7;color:var(--muted)">
      <div style="text-align:center;padding:10px 0 16px">
        <img src="https://i.ibb.co/vRhd1z8/file-000000002ff8821188874960e8816b30-removebg-preview.png" style="width:64px;height:64px;margin:0 auto 10px;object-fit:contain">
        <div style="font-size:18px;font-weight:800;color:var(--text)">ZISHU AI</div>
        <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase">by ZISHU TRON</div>
      </div>
      <p><b style="color:var(--text)">Version</b> ${APP.version}</p>
      <p style="margin-top:8px"><b style="color:var(--text)">Bring your own AI</b><br>
      ZISHU AI is provider-agnostic. Add your own OpenAI, OpenRouter, Gemini, Anthropic, Groq, DeepSeek, or custom OpenAI-compatible endpoint.</p>
    </div>`;
  },

  save(){ saveSettings(); UI.toast('Settings saved','ok'); }
};

document.addEventListener('click',(e)=>{
  if(!e.target.closest('#plus-btn') && !e.target.closest('#plus-menu')) Composer.closePlus();
  if(!e.target.closest('#model-pill') && !e.target.closest('#model-menu')) Models.closeMenu();
  if(e.target.id==='settings-overlay') Settings.close();
});

document.getElementById('file-input').addEventListener('change',e=>{ Files.handleFiles(e.target.files); e.target.value=''; });
document.getElementById('image-input').addEventListener('change',e=>{ Files.handleFiles(e.target.files); e.target.value=''; });

window.addEventListener('online',()=>UI.toast('Back online','ok'));
window.addEventListener('offline',()=>UI.toast('You are offline. Saved chats are still available.','err'));

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ Composer.closePlus(); Models.closeMenu(); Settings.close(); Voice.stopSpeaking(); }
  if(e.ctrlKey && e.key==='k'){ e.preventDefault(); document.getElementById('chat-search').focus(); }
  if(e.ctrlKey && e.key==='b'){ e.preventDefault(); UI.toggleSidebar(); }
});

function handleHashRoute(){
  const h=location.hash||'';
  const m=h.match(/^#\/chat\/(.+)$/);
  if(m){
    const id=m[1];
    if(State.chats[id]){ State.currentId=id; Chat.render(); Chat.renderList(); }
    else {
      const ids=Object.keys(State.chats).sort((a,b)=>State.chats[b].updatedAt-State.chats[a].updatedAt);
      if(ids.length){ State.currentId=ids[0]; location.hash='#/chat/'+ids[0]; Chat.render(); Chat.renderList(); }
      else { Chat.newChat(); }
    }
  } else {
    const ids=Object.keys(State.chats).sort((a,b)=>State.chats[b].updatedAt-State.chats[a].updatedAt);
    if(ids.length){ State.currentId=ids[0]; location.hash='#/chat/'+ids[0]; }
    else { Chat.newChat(); }
  }
}

window.addEventListener('hashchange',handleHashRoute);

async function init(){
  await loadAll();
  const migrated=await migrateLegacy();
  if(migrated) UI.toast('Imported chats from the old Stardust app','ok');
  if(State.settings.theme==='system') State.settings.theme = matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  applyTheme(State.settings.theme);
  Composer.renderAttachments();
  handleHashRoute();
  Models.updatePill();
  document.getElementById('web-btn')?.classList.toggle('on',State.settings.webSearch);
  document.getElementById('deep-btn')?.classList.toggle('on',State.settings.deepResearch);
  if(State.settings.mode!=='chat') document.getElementById(State.settings.mode+'-btn')?.classList.add('on');
  document.getElementById('ws-toggle-btn').style.display=State.settings.showWorkspaceButton?'flex':'none';
}

window.addEventListener('DOMContentLoaded',init);

window.State=State; window.UI=UI; window.Chat=Chat; window.Models=Models;
window.Settings=Settings; window.Workspace=Workspace; window.Files=Files;
window.Voice=Voice; window.Composer=Composer; window.Renderer=Renderer;
window.Security=Security; window.saveSettings=saveSettings; window.applyTheme=applyTheme;
</script>
</body>
</html>
