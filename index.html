<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08080c">
<title>ZISHU AI</title>
<link rel="icon" href="https://i.ibb.co/vRhd1z8/file-000000002ff8821188874960e8816b30-removebg-preview.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/xml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<style>
:root{
  --bg:#08080c; --surface:#101018; --surface-2:#16161f; --surface-3:#1c1c28;
  --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.12);
  --text:#f4f4f8; --muted:#8b8b9e; --muted-2:#5c5c70;
  --accent:#7c6cff; --accent-2:#5b8cff; --accent-3:#ff8a5b;
  --danger:#ff5c6c; --success:#3ddc97; --warning:#ffb84d;
  --glow:0 0 60px rgba(124,108,255,.35);
  --radius:18px; --radius-sm:12px; --radius-xs:9px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
}
[data-theme="light"]{
  --bg:#f6f6f9; --surface:#ffffff; --surface-2:#f0f0f5; --surface-3:#e8e8ef;
  --border:rgba(0,0,0,.08); --border-strong:rgba(0,0,0,.14);
  --text:#14141c; --muted:#6b6b7e; --muted-2:#9a9aad;
  --glow:0 0 60px rgba(124,108,255,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none;transition:background .3s,color .3s}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;outline:none;border:none;background:none;color:inherit}
img{display:block;max-width:100%}
.hidden{display:none !important}

#app{display:flex;height:100dvh;position:relative;overflow:hidden}

#sidebar{width:280px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:margin-left .28s cubic-bezier(.4,0,.2,1);z-index:40}
#sidebar.collapsed{margin-left:-280px}
.sb-head{padding:14px 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sb-brand{display:flex;align-items:center;gap:9px;min-width:0}
.sb-brand img{width:32px;height:32px;border-radius:10px;object-fit:contain;background:var(--surface-2);border:1px solid var(--border)}
.sb-brand .t{font-size:14px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.sb-brand .s{font-size:8px;font-weight:600;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.new-chat-btn{margin:4px 12px 10px;padding:10px 12px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .2s;box-shadow:0 4px 18px rgba(124,108,255,.28)}
.new-chat-btn:hover{filter:brightness(1.1)}
.new-chat-btn:active{transform:scale(.97)}
.sb-search{margin:0 12px 8px;position:relative}
.sb-search input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-xs);padding:8px 10px 8px 32px;font-size:12.5px;color:var(--text);transition:border-color .2s}
.sb-search input:focus{border-color:var(--accent)}
.sb-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted)}
.sb-list{flex:1;overflow-y:auto;padding:4px 8px 8px}
.sb-group{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);padding:10px 8px 5px}
.sb-item{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:var(--radius-xs);cursor:pointer;transition:background .15s;position:relative}
.sb-item:hover{background:var(--surface-2)}
.sb-item.active{background:var(--surface-3)}
.sb-item .title{flex:1;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.sb-item .time{font-size:9.5px;color:var(--muted-2);flex-shrink:0}
.sb-item .acts{display:none;gap:2px;flex-shrink:0}
.sb-item:hover .acts{display:flex}
.sb-item .acts button{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.sb-item .acts button:hover{background:var(--surface-3);color:var(--text)}
.sb-item .acts svg{width:11px;height:11px}
.sb-foot{padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted-2)}
.sb-foot button{font-size:10px;color:var(--muted);padding:4px 8px;border-radius:6px;display:flex;align-items:center;gap:5px}
.sb-foot button:hover{background:var(--surface-2);color:var(--text)}
.sb-foot svg{width:12px;height:12px}

#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#topbar{height:52px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--surface);z-index:30;backdrop-filter:blur(20px)}
.icon-btn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s,color .15s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn svg{width:18px;height:18px}
.model-pill{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text);transition:border-color .2s;max-width:240px}
.model-pill:hover{border-color:var(--border-strong)}
.model-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex-shrink:0;box-shadow:0 0 8px var(--success)}
.model-pill .dot.off{background:var(--muted-2);box-shadow:none}
.model-pill .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-pill svg{width:12px;height:12px;color:var(--muted);flex-shrink:0}

#chat-scroll{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;position:relative}
#chat-inner{max-width:820px;margin:0 auto;padding:20px 16px 130px;width:100%}

.welcome{min-height:calc(100dvh - 260px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 16px}
.welcome-logo{width:110px;height:110px;object-fit:contain;margin-bottom:26px;animation:logoFloat 5s ease-in-out infinite;filter:drop-shadow(0 8px 30px rgba(124,108,255,.35))}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.welcome h1{font-size:32px;font-weight:800;letter-spacing:-.03em;margin-bottom:12px;background:linear-gradient(135deg,var(--text),var(--muted));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2;max-width:640px}
.welcome p{font-size:15px;color:var(--muted);max-width:480px;line-height:1.6}
.welcome .sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);margin-bottom:10px;font-weight:600}

.msg{display:flex;gap:11px;margin-bottom:20px;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.avatar{width:29px;height:29px;border-radius:9px;flex-shrink:0;overflow:hidden;border:1px solid var(--border)}
.avatar img{width:100%;height:100%;object-fit:contain;background:var(--surface-2)}
.avatar.user{background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.msg-body{max-width:calc(100% - 40px);min-width:0}
.msg.user .msg-body{display:flex;flex-direction:column;align-items:flex-end}
.bubble{padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.65;word-wrap:break-word;overflow-wrap:break-word}
.msg.user .bubble{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-bottom-right-radius:5px}
.msg.ai .bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px;color:var(--text)}
.msg.ai .bubble.error{border-color:var(--danger);background:rgba(255,92,108,.06)}

.md h1,.md h2,.md h3,.md h4{margin:.7em 0 .35em;font-weight:700;line-height:1.3}
.md h1{font-size:1.35em}.md h2{font-size:1.18em}.md h3{font-size:1.05em}
.md p{margin:.45em 0}
.md ul,.md ol{padding-left:1.4em;margin:.45em 0}
.md li{margin:.18em 0}
.md a{color:var(--accent-2);text-decoration:underline}
.md blockquote{border-left:3px solid var(--accent);padding-left:.8em;margin:.6em 0;color:var(--muted)}
.md code:not(pre code){background:var(--surface-3);padding:2px 6px;border-radius:5px;font-size:.87em;font-family:var(--mono);color:var(--accent-3)}
.md table{border-collapse:collapse;width:100%;margin:.6em 0;font-size:.9em}
.md th,.md td{border:1px solid var(--border-strong);padding:6px 10px;text-align:left}
.md th{background:var(--surface-2);font-weight:600}
.md hr{border:none;border-top:1px solid var(--border);margin:1em 0}
.md img{max-width:100%;border-radius:12px;margin:.5em 0;border:1px solid var(--border)}

.code-wrap{margin:.6em 0;border-radius:12px;overflow:hidden;border:1px solid var(--border-strong);background:#0d1117}
.code-head{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:#161b22;border-bottom:1px solid #30363d;gap:8px}
.code-head .lang{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8b949e}
.code-head .btns{display:flex;gap:4px;flex-wrap:wrap}
.code-head button{background:#21262d;color:#c9d1d9;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:600;transition:.15s}
.code-head button:hover{background:#30363d;color:#f0f6fc}
.code-wrap pre{margin:0;padding:12px;overflow-x:auto}
.code-wrap pre code{font-family:var(--mono);font-size:12.5px;line-height:1.55;background:none!important;padding:0!important}

.msg-acts{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap;opacity:0;transition:opacity .2s}
.msg:hover .msg-acts,.msg-acts.show{opacity:1}
.msg-acts button{font-size:10.5px;color:var(--muted);padding:4px 9px;border-radius:6px;transition:.15s;display:flex;align-items:center;gap:5px}
.msg-acts button:hover{background:var(--surface-2);color:var(--text)}
.msg-acts button.speaking{background:rgba(255,92,108,.15);color:var(--danger)}
.msg-acts svg{width:12px;height:12px}

.thinking{display:flex;align-items:center;gap:9px;padding:4px 0}
.thinking .txt{font-size:12.5px;color:var(--muted);font-weight:500}
.dots{display:flex;gap:4px}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:db 1.3s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}
@keyframes db{0%,60%,100%{transform:scale(.6);opacity:.35}30%{transform:scale(1.1);opacity:1}}
.cursor{display:inline-block;width:2px;height:15px;background:var(--accent);margin-left:2px;vertical-align:text-bottom;animation:blink .85s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.research-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px;font-size:12px}
.research-panel .rp-head{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px;color:var(--text)}
.research-panel .rp-head .spinner{width:13px;height:13px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rp-steps{display:flex;flex-direction:column;gap:5px}
.rp-step{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11.5px}
.rp-step .mark{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.rp-step.done .mark{background:var(--success);border-color:var(--success)}
.rp-step.done .mark::after{content:'';width:4px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.rp-step.active .mark{border-color:var(--accent);border-top-color:transparent;animation:spin .7s linear infinite}
.rp-step.done{color:var(--text)}

.sources{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.sources .st{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.src-item{display:flex;gap:9px;padding:8px;border-radius:8px;text-decoration:none;color:inherit;transition:.15s;margin-bottom:4px}
.src-item:hover{background:var(--surface-2)}
.src-num{width:19px;height:19px;border-radius:5px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accent);flex-shrink:0}
.src-info{min-width:0;flex:1}
.src-info .st2{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-info .su{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#composer{position:absolute;bottom:0;left:0;right:0;padding:10px 14px calc(12px + var(--safe-b));background:linear-gradient(to top,var(--bg) 55%,transparent);z-index:25}
.composer-box{max-width:820px;margin:0 auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,.35);transition:border-color .2s,box-shadow .2s}
.composer-box:focus-within{border-color:var(--accent);box-shadow:0 8px 40px rgba(124,108,255,.18)}
.attach-row{display:flex;flex-wrap:wrap;gap:6px;padding:9px 12px 0}
.attach-chip{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:11px;max-width:200px}
.attach-chip img{width:26px;height:26px;border-radius:5px;object-fit:cover}
.attach-chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.attach-chip button{color:var(--danger);font-size:14px;line-height:1;padding:0 2px}
.input-row{display:flex;align-items:flex-end;gap:6px;padding:7px 9px}
.input-row textarea{flex:1;resize:none;max-height:180px;min-height:26px;padding:9px 6px;font-size:14.5px;line-height:1.5;color:var(--text);background:none}
.input-row textarea::placeholder{color:var(--muted-2)}
.tool-btn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.15s;flex-shrink:0}
.tool-btn:hover{background:var(--surface-2);color:var(--text)}
.tool-btn.active{background:rgba(124,108,255,.15);color:var(--accent)}
.tool-btn svg{width:18px;height:18px}
.send-btn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;transition:.15s;flex-shrink:0;box-shadow:0 3px 14px rgba(124,108,255,.35)}
.send-btn:hover{filter:brightness(1.12)}
.send-btn:active{transform:scale(.93)}
.send-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.send-btn svg{width:17px;height:17px}
.send-btn.stop{background:var(--danger);box-shadow:0 3px 14px rgba(255,92,108,.35)}
.composer-hint{text-align:center;font-size:10px;color:var(--muted-2);margin-top:6px}

.plus-menu{position:absolute;bottom:100%;left:0;margin-bottom:8px;background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;box-shadow:0 16px 50px rgba(0,0,0,.5);padding:6px;min-width:230px;display:none;z-index:60}
.plus-menu.open{display:block;animation:pop .15s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.plus-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:9px;font-size:13px;font-weight:500;color:var(--text);transition:.15s;text-align:left}
.plus-menu button:hover{background:var(--surface-2)}
.plus-menu button svg{width:16px;height:16px;color:var(--muted);flex-shrink:0}
.plus-menu button.on svg{color:var(--accent)}
.plus-menu .sep{height:1px;background:var(--border);margin:5px 8px}
.plus-menu .lbl{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);padding:6px 11px 3px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:20px;width:100%;max-width:680px;max-height:88dvh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6);animation:modalIn .22s cubic-bezier(.2,.8,.3,1)}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-head h2{font-size:16px;font-weight:700;letter-spacing:-.01em}
.modal-body{flex:1;overflow-y:auto;padding:18px}

.tabs{display:flex;gap:3px;padding:0 18px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.tab{padding:11px 14px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;transition:.15s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;color:var(--text);transition:border-color .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field .hint{font-size:10.5px;color:var(--muted-2);margin-top:4px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:8px 16px;border-radius:9px;font-size:12.5px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface-3)}
.btn-danger{background:rgba(255,92,108,.15);color:var(--danger);border:1px solid rgba(255,92,108,.3)}
.btn-danger:hover{background:rgba(255,92,108,.25)}

.prov-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:9px;display:flex;flex-direction:column;gap:10px}
.prov-card .pc-top{display:flex;align-items:center;gap:12px;min-width:0}
.prov-card .pc-ic{width:36px;height:36px;border-radius:9px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0}
.prov-card .pc-info{flex:1;min-width:0}
.prov-card .pc-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prov-card .pc-meta{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.prov-card .pc-acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.prov-card .pc-acts button{font-size:10.5px;padding:5px 10px;border-radius:6px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.prov-card .pc-acts button:hover{color:var(--text)}
.badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;background:rgba(61,220,151,.15);color:var(--success);letter-spacing:.04em}
.badge.off{background:var(--surface-3);color:var(--muted)}
.badge.free{background:rgba(91,140,255,.18);color:var(--accent-2)}

.model-menu{position:absolute;top:100%;left:0;margin-top:6px;background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;box-shadow:0 16px 50px rgba(0,0,0,.5);width:330px;max-height:440px;overflow-y:auto;z-index:60;display:none;padding:6px}
.model-menu.open{display:block;animation:pop .15s ease}
.mm-group{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);padding:9px 11px 4px}
.mm-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;cursor:pointer;transition:.15s}
.mm-item:hover{background:var(--surface-2)}
.mm-item.sel{background:rgba(124,108,255,.12)}
.mm-item .mi-ic{width:26px;height:26px;border-radius:7px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.mm-item .mi-ic svg{width:14px;height:14px}
.mm-item .mi-info{flex:1;min-width:0}
.mm-item .mi-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm-item .mi-prov{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm-item .mi-cap{display:flex;gap:3px;flex-shrink:0}
.mm-item .mi-cap span{font-size:8px;font-weight:700;padding:2px 5px;border-radius:5px;background:var(--surface-3);color:var(--muted)}
.mm-item .mi-cap span.v{background:rgba(91,140,255,.18);color:var(--accent-2)}

#workspace{width:46%;min-width:320px;max-width:60%;background:var(--surface);border-left:1px solid var(--border);display:none;flex-direction:column;z-index:35}
#workspace.open{display:flex}
.ws-head{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.ws-tab{padding:6px 12px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:7px;transition:.15s;white-space:nowrap}
.ws-tab:hover{background:var(--surface-2);color:var(--text)}
.ws-tab.active{background:var(--surface-3);color:var(--accent)}
.ws-actions{margin-left:auto;display:flex;gap:3px}
.ws-body{flex:1;overflow:hidden;position:relative;background:var(--bg)}
.ws-pane{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.ws-pane.active{display:flex}
.ws-pane iframe{width:100%;height:100%;border:none;background:#fff}
.ws-editor{flex:1;display:flex;overflow:hidden}
.file-tree{width:180px;border-right:1px solid var(--border);overflow-y:auto;padding:6px;flex-shrink:0;background:var(--surface-2)}
.ft-item{padding:5px 9px;border-radius:6px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--muted)}
.ft-item:hover{background:var(--surface-3);color:var(--text)}
.ft-item.active{background:var(--surface-3);color:var(--accent)}
.code-area{flex:1;overflow:auto;padding:10px;font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre;tab-size:2;background:var(--bg);color:var(--text)}
.ws-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:12.5px;gap:10px;padding:20px;text-align:center}
.ws-empty svg{width:40px;height:40px;opacity:.3}

#toast{position:fixed;bottom:calc(90px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);padding:10px 18px;border-radius:11px;font-size:12.5px;font-weight:500;z-index:300;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--danger);color:var(--danger)}
#toast.ok{border-color:var(--success)}

.gen-img{border-radius:12px;max-width:100%;border:1px solid var(--border);margin:8px 0;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.img-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.img-acts button{font-size:10.5px;padding:4px 10px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.img-acts button:hover{background:var(--surface-3);color:var(--text)}
.img-acts svg{width:12px;height:12px}

.notice{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px;font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.notice b{color:var(--text)}
.notice .btn{margin-top:8px}

.mobile-only{display:none}
@media(max-width:900px){
  #sidebar{position:fixed;top:0;bottom:0;left:0;z-index:100;margin-left:-280px;box-shadow:0 0 60px rgba(0,0,0,.6)}
  #sidebar.open{margin-left:0}
  #sidebar.collapsed{margin-left:-280px}
  #workspace{position:fixed;inset:0;width:100%;max-width:none;min-width:0;z-index:110;border-left:none}
  .mobile-only{display:flex}
  #sb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:none}
  #sb-overlay.show{display:block}
  .model-menu{position:fixed;left:12px;right:12px;width:auto;max-height:60dvh}
  .welcome h1{font-size:24px}
  .welcome-logo{width:90px;height:90px}
}
@media(max-width:400px){

  .welcome h1{font-size:21px}
  .welcome-logo{width:80px;height:80px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</head>
<body>

        Settings
      </button>
      <span id="storage-info"></span>
    </div>
  </aside>
  <div id="sb-overlay" onclick="UI.closeSidebar()"></div>

  <main id="main">
    <header id="topbar">
      <button class="icon-btn" onclick="UI.toggleSidebar()" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>

        <div class="model-menu" id="model-menu"></div>

      </button>
      <button class="icon-btn" onclick="Workspace.toggle()" title="Toggle workspace" id="ws-toggle-btn" style="display:none">

      </button>
      <button class="icon-btn" onclick="Settings.open('general')" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>

    <div id="chat-scroll">

const State = {

  settings: {

const Storage = (() => {
  const DB_NAME='zishu_ai', DB_VER=1, STORE='kv';
  let db=null;
  function open(){
    return new Promise((resolve,reject)=>{
      if(db) return resolve(db);
      const req=indexedDB.open(DB_NAME,DB_VER);
      req.onupgradeneeded=e=>{ const d=e.target.result; if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE); };
      req.onsuccess=e=>{db=e.target.result;resolve(db);};
      req.onerror=e=>reject(e.target.error);
    });
  }
  async function get(k){ const d=await open(); return new Promise((res,rej)=>{ const t=d.transaction(STORE,'readonly').objectStore(STORE).get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); }
  async function set(k,v){ const d=await open(); return new Promise((res,rej)=>{ const t=d.transaction(STORE,'readwrite').objectStore(STORE).put(v,k); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); }); }
  async function del(k){ const d=await open(); return new Promise((res,rej)=>{ const t=d.transaction(STORE,'readwrite').objectStore(STORE).delete(k); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); }); }
  return { get, set, del };
})();

const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch{ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};

async function migrateLegacy(){
  const old = LS.get('stardust_pro_chats', null);
  if(!old || typeof old!=='object') return false;
  let count=0;
  for(const id of Object.keys(old)){
    const c=old[id];
    if(!c || !Array.isArray(c.messages)) continue;
    const nid='legacy_'+id;
    if(State.chats[nid]) continue;
    State.chats[nid]={
      id:nid, title:c.title||'Imported chat',
      createdAt: Number(id)||Date.now(), updatedAt: Date.now(),
      messages: c.messages.map((m,i)=>({
        id:'m'+i, role:m.role==='ai'?'assistant':'user',
        content:m.text||'', attachments:m.img?[{type:'image',dataUrl:m.img}]:[],
        ts:Date.now(), status:'done'
      })),
      meta:{ provider:null, model:null, legacy:true }
    };
    count++;
  }
  if(count) await saveChats();
  LS.del('stardust_pro_chats');
  return count>0;
}

async function loadAll(){
  const [chats, provs, settings, memory] = await Promise.all([
    Storage.get('chats'), Storage.get('providers'), Storage.get('settings'), Storage.get('memory')
  ]);
  if(chats && typeof chats==='object') State.chats=chats;
  if(Array.isArray(provs)) State.providers=provs;
  if(settings && typeof settings==='object') State.settings={...State.settings,...settings};
  if(Array.isArray(memory)) State.settings.memory=memory;
  if(State.settings.theme==='system') State.settings.theme = matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  applyTheme(State.settings.theme);
}

/* ============ AI REQUEST MANAGER ============ */
const AIRequestManager = {
  buildChat({provider, model, messages, stream=true, temperature, maxTokens, signal}){
    const cfg = PROVIDER_CATALOG[provider.type] || PROVIDER_CATALOG.custom;
    const base = (provider.base||cfg.base||'').replace(/\/$/,'');
    const key = provider.apiKey||'';
    const isAnthropic = provider.type==='anthropic';
    const isGemini = provider.type==='gemini';
    let url, headers, body;

    if(isAnthropic){
      url = `${base}/messages`;
      headers = { 'Content-Type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' };
      const sys = messages.find(m=>m.role==='system');
      const rest = messages.filter(m=>m.role!=='system');
      body = { model, max_tokens: maxTokens||2048, temperature: temperature??0.7, stream, system: sys?sys.content:undefined, messages: rest.map(m=>({role:m.role, content:m.content})) };
    } else if(isGemini && cfg.openaiCompat){
      url = `${cfg.openaiBase}/chat/completions`;
      headers = { 'Content-Type':'application/json', 'Authorization':'Bearer '+key };
      body = { model, messages, temperature: temperature??0.7, max_tokens: maxTokens||2048, stream };
    } else {
      url = `${base}/chat/completions`;
      headers = { 'Content-Type':'application/json' };
      if(provider.type==='gemini') headers['x-goog-api-key']=key;
      else headers['Authorization']='Bearer '+key;
      if(provider.headers && typeof provider.headers==='object') Object.assign(headers, provider.headers);
      body = { model, messages, temperature: temperature??0.7, max_tokens: maxTokens||2048, stream };
    }
    return { url, headers, body, isAnthropic, stream };
  },

  parseOpenAI(line){
    if(!line) return null;
    const t=line.trim();
    if(!t || !t.startsWith('data:')) return null;
    const data=t.slice(5).trim();
    if(data==='[DONE]') return {done:true};
    try{
      const j=JSON.parse(data);
      const delta=j.choices?.[0]?.delta?.content || j.choices?.[0]?.text || j.choices?.[0]?.message?.content || '';
      return {delta};
    }catch{ return null; }
  },

  parseAnthropic(line){
    if(!line) return null;
    const t=line.trim();
    if(!t.startsWith('data:')) return null;
    try{
      const j=JSON.parse(t.slice(5).trim());
      if(j.type==='content_block_delta' && j.delta?.text) return {delta:j.delta.text};
      if(j.type==='message_stop') return {done:true};
      return null;
    }catch{ return null; }
  },

  async chat(opts){
    const {url,headers,body,isAnthropic}=this.buildChat({...opts,stream:false});
    const resp=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:opts.signal});
    if(!resp.ok) throw await this.errorFrom(resp);
    const j=await resp.json();
    let text='';
    if(isAnthropic) text=(j.content||[]).map(c=>c.text||'').join('');
    else text=j.choices?.[0]?.message?.content || j.choices?.[0]?.text || '';
    return {text, usage:j.usage||null, raw:j};
  },

  async stream(opts, onDelta, onDone, onError){
    let {url,headers,body,isAnthropic}=this.buildChat({...opts,stream:true});
    let resp;
    try{
      resp=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:opts.signal});
    }catch(e){
      if(e.name==='AbortError') return;
      onError(e); return;
    }
    if(!resp.ok){ onError(await this.errorFrom(resp)); return; }
    if(!resp.body){ onError(new Error('No response body')); return; }

    const reader=resp.body.getReader();
    const dec=new TextDecoder();
    let buf='';
    let full='';
    try{
      while(true){
        const {done,value}=await reader.read();
        if(done) break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n');
        buf=lines.pop()||'';
        for(const line of lines){
          const parsed = isAnthropic?this.parseAnthropic(line):this.parseOpenAI(line);
          if(!parsed) continue;
          if(parsed.done){ onDone(full); return; }
          if(parsed.delta){ full+=parsed.delta; onDelta(parsed.delta, full); }
        }
      }
    }catch(e){
      if(e.name==='AbortError'){ onDone(full); return; }
      onError(e); return;
    }
    onDone(full);
  },

  async errorFrom(resp){
    let msg=`Request failed (${resp.status})`;
    let detail='';
    try{
      const j=await resp.json();
      detail = j.error?.message || j.message || JSON.stringify(j).slice(0,300);
      if(detail) msg=detail;
    }catch{
      try{ detail=await resp.text(); if(detail) msg=detail.slice(0,300); }catch{}
    }
    const err=new Error(msg); err.status=resp.status; err.detail=detail;
    if(resp.status===401) err.friendly='Your API key was rejected. Check provider settings.';
    else if(resp.status===403) err.friendly='Access denied. The key may lack permission for this model.';
    else if(resp.status===429) err.friendly='Rate limit reached. Try another model or wait a moment.';
    else if(resp.status>=500) err.friendly='Provider server error. Try again or switch models.';
    return err;
  },

  async listModels(provider){
    const cfg=PROVIDER_CATALOG[provider.type]||PROVIDER_CATALOG.custom;
    if(!cfg.modelsEndpoint) return [];
    const base=(provider.base||cfg.base||'').replace(/\/$/,'');
    if(!base) return [];
    let url=base+cfg.modelsEndpoint;
    const headers={};
    if(provider.type==='gemini'){ url+='?key='+encodeURIComponent(provider.apiKey||''); }
    else { headers['Authorization']='Bearer '+(provider.apiKey||''); }
    try{
      const r=await fetch(url,{headers});
      if(!r.ok) return [];
      const j=await r.json();
      const arr=j.data||j.models||[];
      return arr.map(m=>({ id:m.id||m.name?.replace('models/',''), name:m.name||m.id, raw:m })).filter(m=>m.id);
    }catch{ return []; }
  },

  async testConnection(provider){
    const models=await this.listModels(provider);
    if(models.length) return {ok:true, models};
    try{
      const r=await this.chat({ provider, model:provider.model||'default', messages:[{role:'user',content:'ping'}], maxTokens:5 });
      return {ok:true, models:[], sample:r.text};
    }catch(e){ return {ok:false, error:e.friendly||e.message}; }
  },

  async detectFreeModel(provider){
    const cfg = PROVIDER_CATALOG[provider.type] || PROVIDER_CATALOG.custom;
    if(cfg.autoFree) return cfg.autoFree;
    const models = await this.listModels(provider);
    if(!models.length) return null;
    const ids = models.map(m=>m.id);
    const free = ids.find(id => /:free$/i.test(id));
    if(free) return free;
    const small = ids.find(id => /mini|flash|haiku|small|7b|8b|instant|turbo/i.test(id));
    if(small) return small;
    return ids[0];
  }
};

const Search = {
  async query(q, provider, key){
    if(!key) throw new Error('No search API key configured. Add one in Settings → Web Search.');
    if(provider==='tavily'){
      const r=await fetch('https://api.tavily.com/search',{ method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({api_key:key,query:q,max_results:6,search_depth:'advanced',include_answer:false})});
      if(!r.ok) throw new Error('Search failed ('+r.status+')');
      const j=await r.json();
      return (j.results||[]).map(x=>({title:x.title,url:x.url,content:x.content,date:x.published_date||null}));
    }
    if(provider==='brave'){
      const r=await fetch('https://api.search.brave.com/res/v1/web/search?q='+encodeURIComponent(q)+'&count=6',{headers:{'Accept':'application/json','X-Subscription-Token':key}});
      if(!r.ok) throw new Error('Search failed ('+r.status+')');
      const j=await r.json();
      return (j.web?.results||[]).map(x=>({title:x.title,url:x.url,content:x.description,date:x.age||null}));
    }
    if(provider==='serper'){
      const r=await fetch('https://google.serper.dev/search',{ method:'POST',headers:{'Content-Type':'application/json','X-API-KEY':key}, body:JSON.stringify({q,num:6})});
      if(!r.ok) throw new Error('Search failed ('+r.status+')');
      const j=await r.json();
      return (j.organic||[]).map(x=>({title:x.title,url:x.link,content:x.snippet,date:x.date||null}));
    }
    throw new Error('Unknown search provider: '+provider);
  }
};

  pickRecommended(kind){

    if(!enabled.length) return;
    let chosen=enabled[0], model=chosen.models?.[0]||chosen.model;
    const want={Fast:'fast',Balanced:'balanced',Reasoning:'reasoning',Coding:'coding',Vision:'vision'}[kind];
    outer: for(const p of enabled){
      for(const m of (p.models||[])){
        if(want==='vision' && p.caps?.vision){ chosen=p; model=m; break outer; }
        if(want==='reasoning' && p.caps?.reasoning){ chosen=p; model=m; break outer; }
        if(want==='coding' && /code|coder|deepseek|qwen|claude|gpt-4/i.test(m)){ chosen=p; model=m; break outer; }
        if(want==='fast' && /flash|mini|haiku|turbo|small|8b/i.test(m)){ chosen=p; model=m; break outer; }
      }
    }
    this.pick(chosen.id, model);
  },

  updatePill(){
    const label=document.getElementById('model-label');
    const dot=document.getElementById('model-dot');
    const p=State.providers.find(x=>x.id===State.settings.defaultProvider);
    if(!p){ label.textContent='No provider'; dot.className='dot off'; return; }
    const m=State.settings.defaultModel||p.model||'default';
    label.textContent=(p.name?p.name+' · ':'')+m.split('/').pop();
    dot.className='dot';
    dot.style.background='var(--success)';
  }
};

const ContextManager = {
  build(messages, systemPrompt, maxChars=24000){
    const sys={role:'system',content:systemPrompt};
    const msgs=messages.filter(m=>m.content||m.attachments?.length);
    let total=systemPrompt.length;
    const kept=[];
    for(let i=msgs.length-1;i>=0;i--){
      const m=msgs[i];
      const len=(m.content||'').length;
      if(total+len>maxChars && kept.length>=4) break;
      total+=len;
      kept.unshift(m);
    }
    const out=[sys];
    kept.forEach(m=>{
      let content=m.content||'';
      if(m.attachments?.length){
        const imgs=m.attachments.filter(a=>a.type==='image');
        const files=m.attachments.filter(a=>a.type!=='image');
        if(imgs.length) content+=`\n\n[User attached ${imgs.length} image(s)]`;
        files.forEach(f=>{ content+=`\n\n--- FILE: ${f.name} ---\n${(f.text||'').slice(0,8000)}\n--- END FILE ---`; });
      }
      out.push({role:m.role,content});
    });
    return out;
  }
};

const Renderer = {
  md(text){
    if(!window.marked) return Security.esc(text).replace(/\n/g,'<br>');
    const raw = marked.parse(text,{breaks:true,gfm:true});
    return Security.clean(raw);
  },
  finalize(html){
    return html.replace(/<pre><code class="language-(\w+)">([\s\S]*?)<\/code><\/pre>/g,(m,lang,code)=>{
      const L=(lang||'text').toLowerCase();
      const labels={javascript:'JS',typescript:'TS',python:'Python',bash:'Bash',json:'JSON',html:'HTML',css:'CSS',xml:'XML',java:'Java',kotlin:'Kotlin',go:'Go',rust:'Rust',c:'C',cpp:'C++',csharp:'C#',php:'PHP',sql:'SQL',yaml:'YAML',markdown:'MD'};
      return `<div class="code-wrap" data-lang="${L}">
        <div class="code-head">
          <span class="lang">${labels[L]||L.toUpperCase()}</span>
          <div class="btns">
            <button onclick="Renderer.copyCode(this)">Copy</button>
            <button onclick="Renderer.downloadCode(this)">Download</button>
            ${L==='html'||L==='xml'?'<button onclick="Renderer.runCode(this)">Run</button>':''}
          </div>
        </div>
        <pre><code class="language-${L}">${code}</code></pre>
      </div>`;
    });
  },
  highlight(scope){ (scope||document).querySelectorAll('pre code').forEach(b=>{ try{ hljs.highlightElement(b); }catch{} }); },
  copyCode(btn){
    const code=btn.closest('.code-wrap').querySelector('code').textContent;
    navigator.clipboard.writeText(code).then(()=>{ btn.textContent='Copied'; setTimeout(()=>btn.textContent='Copy',1100); });
  },
  downloadCode(btn){
    const wrap=btn.closest('.code-wrap');
    const code=wrap.querySelector('code').textContent;
    const lang=wrap.dataset.lang||'txt';
    const ext={javascript:'js',typescript:'ts',python:'py',bash:'sh',json:'json',html:'html',css:'css',xml:'xml',java:'java',kotlin:'kt',go:'go',rust:'rs',c:'c',cpp:'cpp',csharp:'cs',php:'php',sql:'sql',yaml:'yml',markdown:'md'}[lang]||'txt';
    const blob=new Blob([code],{type:'text/plain'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='code.'+ext; a.click(); URL.revokeObjectURL(a.href);

const Files = {
  pick(){ document.getElementById('file-input').click(); },
  pickImage(){ document.getElementById('image-input').click(); },
  async handleFiles(fileList){
    for(const file of fileList){
      if(file.size>8*1024*1024){ UI.toast(file.name+' is too large (max 8MB)','err'); continue; }
      const isImage=file.type.startsWith('image/');
      const isText=file.type.startsWith('text/') || /\.(md|txt|json|csv|js|ts|py|html|css|xml|yaml|yml|sh|java|kt|c|cpp|cs|go|rs|php|sql)$/i.test(file.name);
      if(isImage){
        const dataUrl=await this.readDataURL(file);
        State.attachments.push({type:'image',name:file.name,size:file.size,dataUrl});
      } else if(isText){
        const text=await this.readText(file);
        State.attachments.push({type:'file',name:file.name,size:file.size,text});
      } else {
        State.attachments.push({type:'file',name:file.name,size:file.size,text:'[Binary file — content not readable]'});
      }
    }
    Composer.renderAttachments();
  },
  readDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsDataURL(file); }); },
  readText(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsText(file); }); },
  remove(i){ State.attachments.splice(i,1); Composer.renderAttachments(); },
  clear(){ State.attachments=[]; Composer.renderAttachments(); }
};

/* ============ VOICE (TTS clean + toggle) ============ */
const Voice = {
  rec:null,
  speaking:false,     // whether TTS is currently active
  currentBtn:null,    // the button that started speaking

  toggle(e){
    e?.stopPropagation();
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR) return UI.toast('Speech recognition not supported in this browser','err');
    if(this.rec){ this.rec.stop(); this.rec=null; document.getElementById('voice-tool')?.classList.remove('on'); return; }
    const r=new SR();
    r.lang=State.settings.voiceLang||'en-US';
    r.interimResults=true; r.continuous=false;
    r.onresult=(ev)=>{ let txt=''; for(const res of ev.results) txt+=res[0].transcript; document.getElementById('input').value=txt; Composer.autosize(document.getElementById('input')); };
    r.onend=()=>{ this.rec=null; document.getElementById('voice-tool')?.classList.remove('on'); };
    r.onerror=(e)=>{ UI.toast('Voice error: '+(e.error||'unknown'),'err'); this.rec=null; };
    r.start(); this.rec=r;
    document.getElementById('voice-tool')?.classList.add('on');
    UI.toast('Listening…');
  },

  /* Strip markdown, code, emojis, symbols — keep only natural text for TTS */
  cleanForSpeech(text){
    if(!text) return '';
    let s = String(text);

    // Remove fenced code blocks entirely
    s = s.replace(/```[\s\S]*?```/g, ' ');
    // Remove inline code (but keep the content, it's often meaningful)
    s = s.replace(/`([^`]+)`/g, '$1');
    // Remove markdown links, keep the label
    s = s.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
    // Remove raw URLs
    s = s.replace(/https?:\/\/\S+/gi, ' ');
    // Remove markdown headings markers
    s = s.replace(/^#{1,6}\s+/gm, '');
    // Remove bold/italic markers
    s = s.replace(/\*\*([^*]+)\*\*/g, '$1');
    s = s.replace(/\*([^*]+)\*/g, '$1');
    s = s.replace(/__([^_]+)__/g, '$1');
    s = s.replace(/_([^_]+)_/g, '$1');
    // Remove strikethrough
    s = s.replace(/~~([^~]+)~~/g, '$1');
    // Remove blockquote markers
    s = s.replace(/^\s*>\s?/gm, '');
    // Remove list markers (-, *, +, numbers)
    s = s.replace(/^\s*[-*+]\s+/gm, '');
    s = s.replace(/^\s*\d+\.\s+/gm, '');
    // Remove horizontal rules
    s = s.replace(/^\s*[-*_]{3,}\s*$/gm, ' ');
    // Remove table pipes
    s = s.replace(/\|/g, ' ');
    // Remove remaining asterisks, underscores, hashes, backticks, tildes
    s = s.replace(/[*_#`~]+/g, ' ');
    // Remove emojis (broad unicode ranges + variation selectors + ZWJ)
    s = s.replace(/[\u{1F300}-\u{1FAFF}]/gu, ' ');
    s = s.replace(/[\u{1F000}-\u{1F2FF}]/gu, ' ');
    s = s.replace(/[\u{2600}-\u{27BF}]/gu, ' ');
    s = s.replace(/[\u{2190}-\u{21FF}]/gu, ' ');
    s = s.replace(/[\u{2B00}-\u{2BFF}]/gu, ' ');
    s = s.replace(/[\u{FE00}-\u{FE0F}]/gu, '');
    s = s.replace(/\u200D/g, '');
    // Remove decorative symbols like ⚠ ✅ ❌ ● ○ ◆ ■ □ ★ ☆
    s = s.replace(/[⚠✅❌●○◆■□★☆✦✧▶◀▲▼→←↑↓•·…]/g, ' ');
    // Collapse whitespace
    s = s.replace(/\s+/g, ' ').trim();

    // Cap length to avoid super long TTS
    if(s.length > 3000) s = s.slice(0, 3000) + '…';
    return s;
  },

  /* Called by the Listen button in message actions */
  speakFromButton(text, btn){
    // If already speaking — stop
    if(this.speaking){
      this.stopSpeaking();
      return;
    }
    if(!('speechSynthesis' in window)) return UI.toast('TTS not supported','err');

    const clean = this.cleanForSpeech(text);
    if(!clean){ UI.toast('Nothing to read','err'); return; }

    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = State.settings.voiceLang || 'en-US';
    u.rate = 0.95;

    u.onstart = ()=>{
      this.speaking = true;
      this.currentBtn = btn;
      if(btn){
        btn.classList.add('speaking');
        btn.innerHTML = Icons.stop + ' Stop';
      }
    };
    u.onend = u.onerror = ()=>{
      this.speaking = false;
      if(this.currentBtn){
        this.currentBtn.classList.remove('speaking');
        this.currentBtn.innerHTML = Icons.listen + ' Listen';
        this.currentBtn = null;
      }
    };

    speechSynthesis.speak(u);
  },

  stopSpeaking(){
    speechSynthesis.cancel();
    this.speaking = false;
    if(this.currentBtn){
      this.currentBtn.classList.remove('speaking');
      this.currentBtn.innerHTML = Icons.listen + ' Listen';
      this.currentBtn = null;
    }
  },

  /* legacy API used in a few places */
  speak(text){
    if(!('speechSynthesis' in window)) return UI.toast('TTS not supported','err');
    const clean = this.cleanForSpeech(text);
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(clean);
    u.lang=State.settings.voiceLang||'en-US';
    u.rate=0.95;
    speechSynthesis.speak(u);
  },
  stop(){ this.stopSpeaking(); }
};

const Chat = {
  newChat(){
    const id='c_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
    State.chats[id]={
      id,title:'New chat',createdAt:Date.now(),updatedAt:Date.now(),
      messages:[], meta:{provider:State.settings.defaultProvider,model:State.settings.defaultModel}
    };
    State.currentId=id;
    saveChats(); this.renderList(); this.render(); UI.closeSidebar();
    location.hash='#/chat/'+id;
    document.getElementById('input').focus();
  },

  current(){ return State.chats[State.currentId]; },

  switch(id){
    if(State.busy) return UI.toast('Please wait for the current response','err');
    State.currentId=id;
    location.hash='#/chat/'+id;
    this.render(); this.renderList(); UI.closeSidebar();
  },

  async delete(id,e){
    e?.stopPropagation();
    if(!confirm('Delete this conversation?')) return;
    delete State.chats[id];
    await saveChats();
    if(State.currentId===id){
      const ids=Object.keys(State.chats);
      State.currentId=ids.length?ids[ids.length-1]:null;
      if(!State.currentId) this.newChat();
      else { this.render(); location.hash='#/chat/'+State.currentId; }
    }
    this.renderList();
  },

  rename(id,e){
    e?.stopPropagation();
    const c=State.chats[id]; if(!c) return;
    const n=prompt('Rename conversation:',c.title);
    if(n?.trim()){ c.title=n.trim(); c.updatedAt=Date.now(); saveChats(); this.renderList(); if(id===State.currentId) this.renderHeader(); }
  },

  duplicate(id,e){
    e?.stopPropagation();
    const c=State.chats[id]; if(!c) return;
    const nid='c_'+Date.now();
    State.chats[nid]={...JSON.parse(JSON.stringify(c)),id:nid,title:c.title+' (copy)',createdAt:Date.now(),updatedAt:Date.now()};
    saveChats(); this.renderList(); UI.toast('Duplicated','ok');
  },

  shareChat(){
    const c=this.current(); if(!c) return UI.toast('No chat to share','err');
    const url=location.origin+location.pathname+'#/chat/'+c.id;
    if(navigator.share){
      navigator.share({title:c.title,url}).catch(()=>{});
    } else {
      navigator.clipboard.writeText(url).then(()=>UI.toast('Link copied to clipboard','ok')).catch(()=>{ prompt('Copy this link:',url); });
    }
  },

  search(q){
    const list=document.getElementById('chat-list');
    const query=q.trim().toLowerCase();
    if(!query){ this.renderList(); return; }
    const hits=[];
    for(const id of Object.keys(State.chats)){
      const c=State.chats[id];
      if(c.title.toLowerCase().includes(query)) hits.push({id,c,snippet:c.title});
      else {
        const m=c.messages.find(m=>(m.content||'').toLowerCase().includes(query));
        if(m) hits.push({id,c,snippet:m.content.slice(0,80)});
      }
    }
    if(!hits.length){ list.innerHTML=`<div style="padding:14px;font-size:12px;color:var(--muted)">No matches.</div>`; return; }
    list.innerHTML=hits.map(h=>`
      <div class="sb-item" onclick="Chat.switch('${h.id}')">
        <div class="title">${Security.esc(h.c.title)}</div>
        <div class="time">${Security.esc(h.snippet.slice(0,30))}…</div>
      </div>`).join('');
  },

  renderList(){
    const list=document.getElementById('chat-list');
    const ids=Object.keys(State.chats).sort((a,b)=>State.chats[b].updatedAt-State.chats[a].updatedAt);
    if(!ids.length){ list.innerHTML=`<div style="padding:14px;font-size:12px;color:var(--muted)">No conversations yet.</div>`; return; }
    const groups={today:[],yesterday:[],week:[],older:[]};
    const now=new Date(); const startToday=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
    ids.forEach(id=>{
      const t=State.chats[id].updatedAt;
      if(t>=startToday) groups.today.push(id);
      else if(t>=startToday-864e5) groups.yesterday.push(id);
      else if(t>=startToday-7*864e5) groups.week.push(id);
      else groups.older.push(id);
    });
    const labels={today:'Today',yesterday:'Yesterday',week:'Previous 7 days',older:'Older'};
    let html='';
    for(const k of ['today','yesterday','week','older']){
      if(!groups[k].length) continue;
      html+=`<div class="sb-group">${labels[k]}</div>`;
      html+=groups[k].map(id=>{
        const c=State.chats[id];
        const active=id===State.currentId?'active':'';
        const time=new Date(c.updatedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        return `<div class="sb-item ${active}" onclick="Chat.switch('${id}')">
          <div class="title">${Security.esc(c.title)}</div>
          <div class="time">${time}</div>
          <div class="acts">
            <button onclick="Chat.rename('${id}',event)" title="Rename">${Icons.rename}</button>
            <button onclick="Chat.duplicate('${id}',event)" title="Duplicate">${Icons.dup}</button>
            <button onclick="Chat.delete('${id}',event)" title="Delete">${Icons.del}</button>
          </div>
        </div>`;
      }).join('');
    }
    list.innerHTML=html;
    document.getElementById('storage-info').textContent=ids.length+' chats';
  },

  renderHeader(){
    const c=this.current();
    if(c) document.title=(c.title||'ZISHU AI')+' · ZISHU AI';
    Models.updatePill();
  },

  render(){

    let html='';
    c.messages.forEach((m,i)=>{ html+=this.messageHTML(m,i); });

  welcomeHTML(){

      <b>No AI provider configured.</b><br>

      <br><button class="btn btn-primary" onclick="Settings.open('providers')">Configure AI provider</button>

  messageHTML(m,i){
    const isUser=m.role==='user';
    const avatar=isUser
      ? `<div class="avatar user">U</div>`
      : `<div class="avatar"><img src="https://i.ibb.co/vRhd1z8/file-000000002ff8821188874960e8816b30-removebg-preview.png" alt="AI" onerror="this.style.display='none'"></div>`;
    let body='';
    if(m.status==='thinking' && !m.content){
      body=`<div class="thinking"><span class="txt">${m.thinkingLabel||'Thinking'}</span><div class="dots"><span></span><span></span><span></span></div></div>`;
    } else if(isUser){
      body=`<div class="bubble">${Security.esc(m.content).replace(/\n/g,'<br>')}${this.attachmentHTML(m)}</div>`;
    } else {
      const html=m.rendered || Renderer.finalize(Renderer.md(m.content||''));
      body=`<div class="bubble md${m.error?' error':''}">${html}${m.content?'':'<span class="cursor"></span>'}</div>`;

    return `<div class="msg ${isUser?'user':'ai'}" data-idx="${i}">

  },

  actionsHTML(m,i){
    if(m.status==='thinking') return '';
    const isUser=m.role==='user';
    if(isUser){
      return `<div class="msg-acts">
        <button onclick="Chat.edit(${i})">${Icons.edit} Edit</button>

    }
    return `<div class="msg-acts ${m.status==='streaming'?'':'show'}">

      <button class="listen-btn" onclick="Chat.listen(${i}, this)">${Icons.listen} Listen</button>
      ${m.rawHTML?`<button onclick="Workspace.showArtifact(State.chats[State.currentId].messages[${i}].rawHTML)">${Icons.play} Open artifact</button>`:''}
    </div>`;

  copyMsg(i){
    const m=this.current()?.messages[i]; if(!m) return;
    navigator.clipboard.writeText(m.content||'').then(()=>UI.toast('Copied','ok'));
  },

  /* Listen button handler — toggles speaking */
  listen(i, btn){
    const m=this.current()?.messages[i]; if(!m) return;
    Voice.speakFromButton(m.content||'', btn);
  },

  edit(i){
    const c=this.current(); if(!c) return;
    const m=c.messages[i]; if(m.role!=='user') return;
    const n=prompt('Edit message:',m.content);
    if(n===null) return;
    c.messages=c.messages.slice(0,i);
    c.messages.push({id:'m'+Date.now(),role:'user',content:n,attachments:m.attachments||[],ts:Date.now(),status:'done'});
    c.updatedAt=Date.now();
    saveChats(); this.render();
    this.send({fromEdit:true});
  },

  regen(i){
    if(State.busy) return UI.toast('Please wait','err');
    const c=this.current(); if(!c) return;
    const msg=c.messages[i];
    if(!msg || msg.role!=='assistant') return;
    let userIdx=-1;
    for(let k=i-1;k>=0;k--){ if(c.messages[k].role==='user'){ userIdx=k; break; } }
    if(userIdx<0) return UI.toast('Nothing to regenerate','err');
    c.messages=c.messages.slice(0, userIdx+1);
    c.updatedAt=Date.now();
    saveChats(); this.render();
    this.send({ regenerate:true });
  },

  async send(opts={}){
    if(State.busy) return;
    // Stop any TTS that's playing
    Voice.stopSpeaking();

    const input=document.getElementById('input');
    const text=input.value.trim();
    const isRegen = opts.regenerate === true;

    if(!isRegen && !text && !State.attachments.length){
      UI.toast('Type a message or attach a file','err');
      return;
    }

    const c=this.current() || (this.newChat(),this.current());

    if(!isRegen){
      const userMsg={
        id:'m'+Date.now(), role:'user', content:text,
        attachments:JSON.parse(JSON.stringify(State.attachments)),
        ts:Date.now(), status:'done'
      };
      c.messages.push(userMsg);
      if(c.title==='New chat' && text) c.title=text.slice(0,42)+(text.length>42?'…':'');
      Files.clear();
      input.value=''; Composer.autosize(input);
    }

    c.updatedAt=Date.now();
    await saveChats();
    this.renderList();
    this.render();

    const provider=State.providers.find(p=>p.id===State.settings.defaultProvider && p.enabled!==false);
    if(!provider && State.settings.mode!=='image'){
      UI.toast('No AI provider configured. Add one in Settings.','err');
      Settings.open('providers');
      return;
    }

    if(State.settings.mode==='image'){
      const lastUser=c.messages[c.messages.length-1];
      return this.generateImage(lastUser?.content||'', c);
    }

    let sources=[];
    const lastUserContent = c.messages.filter(m=>m.role==='user').slice(-1)[0]?.content || '';
    if(State.settings.webSearch && lastUserContent && !isRegen){
      const aiIdx=c.messages.length;
      c.messages.push({id:'m'+Date.now(),role:'assistant',content:'',status:'thinking',thinkingLabel:State.settings.deepResearch?'Researching':'Searching the web',ts:Date.now()});
      this.render();
      try{ sources=await this.runSearch(lastUserContent, c.messages[aiIdx]); }
      catch(e){ c.messages[aiIdx].thinkingLabel='Search unavailable'; }
    }

    const aiIdx=c.messages.length;
    const aiMsg={id:'m'+Date.now()+1,role:'assistant',content:'',status:'thinking',thinkingLabel:'Thinking',ts:Date.now()};
    c.messages.push(aiMsg);
    this.render();

    State.busy=true;
    State.abortController=new AbortController();
    this.setSendButton(true);

    const allMsgs = c.messages.slice(0,-1);
    const sysPrompt=this.buildSystemPrompt(sources);
    const apiMessages=ContextManager.build(allMsgs, sysPrompt);

    let full='';
    let firstDelta=true;
    const isCodingMode = State.settings.mode==='code';

    try{
      await AIRequestManager.stream({
        provider:provider,
        model:State.settings.defaultModel||provider.model,
        messages:apiMessages,
        temperature:State.settings.temperature,
        maxTokens:State.settings.maxTokens,
        signal:State.abortController.signal
      }, (delta,acc)=>{
        if(firstDelta){ aiMsg.status='streaming'; firstDelta=false; }
        full=acc;
        aiMsg.content=full;
        aiMsg.rendered=null;
        if(isCodingMode){
          this.streamUpdateFast(aiIdx, full);
        } else {
          this.streamUpdateLines(aiIdx, full);
        }
      }, (final)=>{
        aiMsg.content=final||full||'*(empty response)*';
        aiMsg.rendered=Renderer.finalize(Renderer.md(aiMsg.content));
        aiMsg.status='done';
        const htmlMatch=aiMsg.content.match(/```html\s*([\s\S]*?)```/i);
        if(htmlMatch) aiMsg.rawHTML=htmlMatch[1];
        this.finishSend(aiIdx, sources);
      }, (err)=>{
        aiMsg.status='error'; aiMsg.error=true;
        aiMsg.content=this.friendlyError(err);
        this.finishSend(aiIdx, sources);
      });
    }catch(e){
      aiMsg.status='error'; aiMsg.error=true;
      aiMsg.content=this.friendlyError(e);
      this.finishSend(aiIdx, sources);
    }
  },

  buildSystemPrompt(sources){
    let p=APP.defaultSystem;
    if(State.settings.mode==='code'){
      p+=`\n\nMODE: Coding assistant. Prioritize complete, runnable code. Use proper fenced code blocks with language tags. For web projects, provide full HTML/CSS/JS that can run in a browser.`;
    }
    if(State.settings.memory.length){
      p+=`\n\nUSER MEMORY (user-approved facts to remember):\n`+State.settings.memory.map(m=>'- '+m).join('\n');
    }
    if(sources.length){
      p+=`\n\nWEB SEARCH RESULTS (use these to answer; cite as [1], [2] etc. Do not fabricate sources):\n`;
      sources.forEach((s,i)=>{ p+=`[${i+1}] ${s.title}\nURL: ${s.url}\n${(s.content||'').slice(0,1200)}\n\n`; });
    }
    if(State.settings.webSearch && !sources.length){
      p+=`\n\nWeb search is enabled but no results were returned. If you don't know current facts, say so.`;
    }
    p+=`\n\nCRITICAL: If the user attached a file (see "--- FILE: ... ---" blocks above), and asks what it is / its source / to explain it, you MUST first explain in detail what that file/project is (purpose, tech stack, structure, key sections), THEN optionally summarize or improve. Do NOT skip the explanation.`;
    return p;
  },

  streamUpdateFast(idx, text){
    const el=document.querySelector(`.msg[data-idx="${idx}"] .bubble`);
    if(!el) return;
    el.textContent=text;
    if(!el.querySelector('.cursor')) el.insertAdjacentHTML('beforeend','<span class="cursor"></span>');
    if(UI.nearBottom()) UI.scrollBottom();
  },

  streamUpdateLines(idx, text){
    const el=document.querySelector(`.msg[data-idx="${idx}"] .bubble`);
    if(!el) return;
    const prev = el.dataset.lastText || '';
    const newLines = (text.match(/\n/g)||[]).length;
    const oldLines = (prev.match(/\n/g)||[]).length;
    const grewByLine = newLines > oldLines;
    const grewSignificantly = (text.length - prev.length) > 40;
    if(!grewByLine && !grewSignificantly && text.length < 60) return;
    el.dataset.lastText = text;
    el.textContent=text;
    if(!el.querySelector('.cursor')) el.insertAdjacentHTML('beforeend','<span class="cursor"></span>');
    if(UI.nearBottom()) UI.scrollBottom();
  },

  async finishSend(aiIdx, sources){
    const c=this.current();
    const aiMsg=c.messages[aiIdx];
    if(sources.length){
      aiMsg.sources=sources;
      let srcHtml=`<div class="sources"><div class="st">Sources</div>`;
      sources.forEach((s,i)=>{
        srcHtml+=`<a class="src-item" href="${Security.safeUrl(s.url)}" target="_blank" rel="noopener noreferrer">
          <div class="src-num">${i+1}</div>
          <div class="src-info"><div class="st2">${Security.esc(s.title)}</div><div class="su">${Security.esc(s.url)}</div></div>
        </a>`;
      });
      srcHtml+=`</div>`;
      aiMsg.rendered=(aiMsg.rendered||Renderer.finalize(Renderer.md(aiMsg.content)))+srcHtml;
    }
    c.updatedAt=Date.now();
    await saveChats();
    State.busy=false;
    State.abortController=null;
    this.setSendButton(false);
    this.render();
    this.renderList();
  },

  friendlyError(err){
    if(err.friendly) return '⚠ '+err.friendly+this.techDetails(err);
    if(err.name==='AbortError') return '*(stopped)*';
    if(!navigator.onLine) return '⚠ You are offline. Your saved conversations are still available.';
    return '⚠ '+(err.message||'Something went wrong.')+this.techDetails(err);
  },
  techDetails(err){
    if(!err.detail && !err.status) return '';
    return `\n\n<details><summary style="cursor:pointer;font-size:12px;color:var(--muted)">Technical details</summary>\n\n\`\`\`\n${err.status?'Status: '+err.status+'\n':''}${(err.detail||err.message||'').slice(0,600)}\n\`\`\`\n</details>`;
  },

  setSendButton(busy){
    const b=document.getElementById('send-btn');
    const ic=document.getElementById('send-icon');
    if(busy){
      b.classList.add('stop'); b.title='Stop';
      ic.innerHTML='<rect x="6" y="6" width="12" height="12" rx="2"/>';
      b.onclick=()=>this.stop();
    } else {
      b.classList.remove('stop'); b.title='Send';
      ic.innerHTML='<path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5 12l7-7 7 7"/>';
      b.onclick=()=>this.send();
    }
  },

  stop(){ if(State.abortController){ State.abortController.abort(); } State.busy=false; this.setSendButton(false); UI.toast('Stopped'); },

  async runSearch(query, progressMsg){
    const steps=[{label:'Generating search queries'},{label:'Searching the web'},{label:'Reading sources'},{label:'Synthesizing answer'}];
    let stepIdx=0;
    const render=()=>{
      progressMsg.thinkingLabel=steps[stepIdx]?.label||'Working';
      const panel=document.querySelector('.research-panel');
      if(panel){ panel.querySelectorAll('.rp-step').forEach((el,i)=>{ el.classList.toggle('done',i<stepIdx); el.classList.toggle('active',i===stepIdx); }); }
    };
    const idx=this.current().messages.indexOf(progressMsg);
    this.renderResearchPanel(idx,steps);
    render();
    await new Promise(r=>setTimeout(r,120));
    stepIdx=1; render();

    const queries = State.settings.deepResearch ? [query, query+' latest', query+' news', query+' explained'] : [query];
    let all=[];
    for(const q of queries){ try{ const res=await Search.query(q, State.settings.searchProvider, State.settings.searchKey); all=all.concat(res); }catch(e){} }
    const seen=new Set(); const dedup=[];
    for(const r of all){ if(r.url && !seen.has(r.url)){ seen.add(r.url); dedup.push(r); } }
    dedup.sort((a,b)=>{ const da=a.date?new Date(a.date).getTime():0; const db=b.date?new Date(b.date).getTime():0; return db-da; });
    const sources=dedup.slice(0,State.settings.deepResearch?8:6);
    stepIdx=2; render(); await new Promise(r=>setTimeout(r,150));
    stepIdx=3; render(); await new Promise(r=>setTimeout(r,100));
    return sources;
  },

  renderResearchPanel(idx,steps){
    const c=this.current(); if(!c) return;
    const el=document.querySelector(`.msg[data-idx="${idx}"] .bubble`);
    if(!el) return;
    el.innerHTML=`<div class="research-panel">
      <div class="rp-head"><div class="spinner"></div><span>Deep research</span></div>
      <div class="rp-steps">
        ${steps.map((s,i)=>`<div class="rp-step" data-step="${i}"><div class="mark"></div><span>${s.label}</span></div>`).join('')}
      </div>
    </div>`;
  },

  async generateImage(prompt,c){
    if(!prompt) return UI.toast('Describe the image first','err');
    const seed=Math.floor(Math.random()*1e6);
    const provider=State.settings.imageProvider||'pollinations';
    const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${seed}&nologo=true`;
    const aiMsg={
      id:'m'+Date.now(), role:'assistant', status:'done', ts:Date.now(),
      content:`**Image generated**\n\n![${prompt}](${url})\n\n<div class="img-acts">
        <button onclick="window.open('${Security.safeUrl(url)}','_blank')">${Icons.eye} Open</button>
        <button onclick="Chat.regenImage('${encodeURIComponent(prompt)}')">${Icons.regen} Regenerate</button>
        <button onclick="Chat.copyImageLink('${encodeURIComponent(url)}')">${Icons.link} Copy link</button>
      </div>\n\n<div style="font-size:11px;color:var(--muted);margin-top:6px">Provider: ${provider} · Seed: ${seed}</div>`,
      imagePrompt:prompt
    };
    aiMsg.rendered=Renderer.finalize(Renderer.md(aiMsg.content));
    c.messages.push(aiMsg);
    c.updatedAt=Date.now();
    await saveChats();
    this.render(); this.renderList();
  },
  regenImage(prompt){ this.generateImage(decodeURIComponent(prompt), this.current()); },
  copyImageLink(enc){ navigator.clipboard.writeText(decodeURIComponent(enc)).then(()=>UI.toast('Link copied','ok')); }
};
