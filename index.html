<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stardust AI · Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/html.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f5f0ea; font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; overflow: hidden; height: 100vh; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c4b5a3; border-radius: 10px; }

        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(250, 246, 240, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(221, 208, 192, 0.5);
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
        }

        .app-container {
            height: 100vh;
            padding-top: 52px;
            padding-bottom: 64px;
            display: flex;
            flex-direction: column;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 8px 16px;
            overscroll-behavior: contain;
            background: #f5f0ea;
            will-change: transform;
            scroll-behavior: smooth;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 99;
            background: rgba(250, 246, 240, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(221, 208, 192, 0.5);
            padding: 8px 12px 10px 12px;
            height: 64px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bottom-bar .input-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            background: white;
            border-radius: 24px;
            border: 2px solid #d0c4b6;
            padding: 0 14px;
            height: 44px;
            transition: border-color 0.2s;
            min-width: 0;
        }
        .bottom-bar .input-wrap:focus-within { border-color: #a78b64; }
        .bottom-bar .input-wrap input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 14px;
            color: #3d3228;
            padding: 0 4px;
            min-width: 0;
            width: 100%;
        }
        .bottom-bar .input-wrap input::placeholder { color: #a58b6e; opacity: 0.6; }

        .bottom-bar .icon-btn {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: transparent; border: none; cursor: pointer;
            transition: background 0.2s; color: #6b5a4a; flex-shrink: 0;
        }
        .bottom-bar .icon-btn:hover { background: #ede8e2; }
        .bottom-bar .icon-btn svg { width: 20px; height: 20px; }

        .bottom-bar .send-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, #b7a28b, #a58b6e);
            border: none; color: white; cursor: pointer;
            transition: transform 0.15s, background 0.2s;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .bottom-bar .send-btn:hover { background: linear-gradient(135deg, #a58b6e, #8e714f); transform: scale(1.05); }
        .bottom-bar .send-btn:active { transform: scale(0.92); }
        .bottom-bar .send-btn svg { width: 20px; height: 20px; }

        .menu-dropdown {
            position: absolute; bottom: 56px; left: 0;
            background: white; border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border: 1px solid #e3d7ca; padding: 6px 0;
            min-width: 180px; display: none; z-index: 1000; overflow: hidden;
        }
        .menu-dropdown.open { display: block; }
        .menu-dropdown button {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 16px; width: 100%; border: none;
            background: transparent; cursor: pointer; font-size: 13px;
            color: #3d3228; transition: background 0.15s; font-weight: 500;
        }
        .menu-dropdown button:hover { background: #f5f0ea; }
        .menu-dropdown button svg { width: 18px; height: 18px; color: #8e7a64; flex-shrink: 0; }
        .menu-dropdown .separator { height: 1px; background: #ede8e2; margin: 4px 12px; }

        .sidebar-overlay {
            position: fixed; inset: 0; z-index: 9998;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(2px);
            display: none;
        }
        .sidebar-overlay.show { display: block; }

        .sidebar-panel {
            position: fixed; top: 52px; left: 0;
            height: calc(100vh - 52px); width: 300px; z-index: 9999;
            background: #faf6f0; border-right: 1px solid #e3d7ca;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-100%);
            display: flex; flex-direction: column; padding: 16px;
        }
        .sidebar-panel.open { transform: translateX(0); }

        .glass-panel { background: rgba(255, 251, 245, 0.8); backdrop-filter: blur(8px); border: 1px solid rgba(215, 195, 175, 0.2); }
        
        .message-ai .msg-text-content pre { background: #0d1117; border-radius: 12px; padding: 1rem; overflow-x: auto; margin: 0.5rem 0; }
        .message-ai .msg-text-content pre code { font-size: 0.82rem; color: #e6edf3; }
        .message-ai .msg-text-content p { margin: 0.2rem 0; line-height: 1.6; }
        .message-ai .msg-text-content ul, .message-ai .msg-text-content ol { padding-left: 1.5rem; margin: 0.4rem 0; }
        .message-ai .msg-text-content h1 { font-size: 1.4rem; font-weight: 700; margin: 0.6rem 0 0.2rem; }
        .message-ai .msg-text-content h2 { font-size: 1.2rem; font-weight: 600; margin: 0.5rem 0 0.2rem; }
        .message-ai .msg-text-content h3 { font-size: 1.05rem; font-weight: 600; margin: 0.4rem 0 0.2rem; }
        .message-ai .msg-text-content blockquote { border-left: 3px solid #b7a48b; padding-left: 0.8rem; margin: 0.4rem 0; color: #6b5a4a; font-style: italic; }
        .message-ai .msg-text-content table { border-collapse: collapse; width: 100%; margin: 0.4rem 0; }
        .message-ai .msg-text-content th, .message-ai .msg-text-content td { border: 1px solid #d0c4b6; padding: 0.3rem 0.6rem; text-align: left; }
        .message-ai .msg-text-content th { background: #e8dfd6; }

        .code-block-wrapper { margin: 0.4rem 0; border-radius: 10px; overflow: hidden; border: 1px solid #30363d; }
        .code-toolbar { display: flex; gap: 4px; align-items: center; padding: 4px 10px; background: #161b22; border-bottom: 1px solid #30363d; flex-wrap: wrap; }
        .code-toolbar span { color: #8b949e; font-size: 10px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; }
        .code-toolbar button { background: #21262d; border: none; color: #c9d1d9; padding: 2px 10px; border-radius: 5px; font-size: 10px; cursor: pointer; transition: 0.15s; }
        .code-toolbar button:hover { background: #30363d; color: #f0f6fc; }

        .fade-in { animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .pro-badge { background: linear-gradient(135deg, #b7a28b, #8e714f); color: white; font-size: 8px; font-weight: 700; padding: 2px 8px; border-radius: 20px; letter-spacing: 0.5px; text-transform: uppercase; }

        .thinking-wrapper {
            display: flex; align-items: center; gap: 8px; padding: 2px 0;
        }
        .thinking-text { font-size: 13px; color: #8e7a64; font-weight: 500; letter-spacing: 0.3px; }
        .thinking-dots { display: flex; gap: 5px; align-items: center; }
        .thinking-dots span {
            width: 7px; height: 7px; border-radius: 50%; background: #b7a28b;
            animation: dotBounce 1.4s infinite ease-in-out;
        }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce {
            0%, 60%, 100% { transform: scale(0.6); opacity: 0.4; }
            30% { transform: scale(1.1); opacity: 1; }
        }

        .typing-cursor {
            display: inline-block; width: 2px; height: 16px;
            background: #b7a28b; margin-left: 2px;
            animation: cursorBlink 0.9s step-end infinite;
        }
        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .streaming-text { white-space: pre-wrap; word-wrap: break-word; }

        .msg-actions {
            opacity: 0; max-height: 0; overflow: hidden;
            transition: opacity 0.3s ease, max-height 0.3s ease;
        }
        .msg-actions.visible { opacity: 1; max-height: 40px; }

        .artifact-panel { background: #faf6f0; border-left: 1px solid #e3d7ca; width: 45%; min-width: 280px; max-width: 55%; display: flex; flex-direction: column; }
        .artifact-panel iframe { border: none; width: 100%; height: 100%; background: white; border-radius: 6px; }

        .message-ai { will-change: transform, opacity; }
        .menu-wrapper { position: relative; flex-shrink: 0; }

        /* Image styles */
        .generated-image {
            border-radius: 12px;
            max-width: 100%;
            max-height: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin: 8px 0;
            border: 1px solid #e3d7ca;
        }
        .image-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .image-actions button {
            background: #ede8e2;
            border: none;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.15s;
            color: #3d3228;
            font-weight: 500;
        }
        .image-actions button:hover { background: #d5c9bc; }
        .image-prompt-badge {
            display: inline-block;
            background: #ede8e2;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            color: #6b5a4a;
            margin-top: 4px;
        }
        .image-mode-indicator {
            background: #a78b64;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Image preview container - bottom bar ke upar */
        #image-preview-container {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 6px 16px;
            background: rgba(250, 246, 240, 0.95);
            border-bottom: 1px solid rgba(221, 208, 192, 0.3);
            flex-shrink: 0;
            margin-bottom: 0;
            min-height: 60px;
        }
        #image-preview-container.show {
            display: flex;
        }
        #image-preview-container .preview-img {
            height: 44px;
            width: 44px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #d0c4b6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        #image-preview-container .file-name {
            font-size: 12px;
            color: #5c4b37;
            font-weight: 500;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #image-preview-container .remove-btn {
            background: none;
            border: none;
            color: #e74c3c;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        #image-preview-container .remove-btn:hover {
            background: rgba(231, 76, 60, 0.1);
        }
        #image-preview-container .image-status {
            font-size: 11px;
            color: #8e7a64;
            font-weight: 500;
        }
    </style>
</head>
<body>

<header class="fixed-header">
    <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="p-1 hover:bg-[#ede8e2] rounded-lg transition" aria-label="Menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <img src="./logo.png" alt="logo" class="h-8 w-8 rounded-xl object-cover border border-[#dacfc0] shadow-sm" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2232%22 height=%2232%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23b7a28b%22/%3E%3Ctext x=%2216%22 y=%2222%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2214%22 font-weight=%22bold%22%3ESD%3C/text%3E%3C/svg%3E'">
        <div>
            <div class="text-sm font-bold text-[#4d3e2e] tracking-tight flex items-center gap-2">
                Stardust AI <span class="pro-badge">Pro</span>
            </div>
            <div class="text-[8px] text-[#a58b6e] font-medium tracking-widest uppercase">Intelligent Assistant</div>
        </div>
    </div>
    <div class="flex items-center gap-1">
        <button onclick="toggleArtifact()" id="artifact-toggle" class="p-1.5 hover:bg-[#ede8e2] rounded-lg transition" aria-label="Artifact">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/><path d="M8 6v12M12 6v12M16 6v12"/></svg>
        </button>
        <button onclick="toggleImageMode()" id="image-mode-btn" class="p-1.5 hover:bg-[#ede8e2] rounded-lg transition" aria-label="Image Mode">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H4a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </button>
    </div>
</header>

<div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

<div id="sidebar" class="sidebar-panel">
    <div class="flex justify-between items-center border-b border-[#ddd0c0] pb-3 mb-3">
        <span class="font-semibold text-[#4d3e2e]">Navigation</span>
        <button onclick="closeSidebar()" class="text-xl text-gray-500 hover:text-gray-700">✕</button>
    </div>
    <button onclick="newChat()" class="w-full bg-gradient-to-r from-[#b7a28b] to-[#a58b6e] hover:from-[#a58b6e] hover:to-[#8e714f] text-white font-semibold py-2.5 rounded-2xl shadow-md transition transform active:scale-95 flex items-center justify-center gap-2 text-sm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        New Chat
    </button>
    <div class="mt-3 relative">
        <input id="search-input" oninput="filterHistory(this.value)" placeholder="Search chats..." class="w-full bg-white/60 border border-[#d0c4b6] rounded-xl px-4 py-2 text-sm outline-none focus:border-[#a78b64] transition">
    </div>
    <div class="mt-3 flex-1 overflow-hidden flex flex-col">
        <div class="flex items-center justify-between px-1">
            <span class="text-[10px] font-bold text-[#a58b6e] uppercase tracking-wider">Conversations</span>
            <span class="text-[9px] text-[#a58b6e]" id="chat-count">0</span>
        </div>
        <div id="history-list" class="flex-1 overflow-y-auto mt-2 space-y-1 pr-1"></div>
    </div>
    <div class="pt-3 border-t border-[#ddd0c0] text-center text-[9px] text-[#a58b6e] font-medium">© 2026 Stardust Inc.</div>
</div>

<div class="app-container">
    <div class="flex flex-1 overflow-hidden">
        <div class="flex-1 flex flex-col overflow-hidden min-w-0">
            <!-- Image Preview Container - positioned above bottom bar -->
            <div id="image-preview-container">
                <img id="image-preview" class="preview-img" src="" alt="Preview">
                <span id="image-file-name" class="file-name"></span>
                <span class="image-status">📎 Image attached</span>
                <button class="remove-btn" onclick="clearImage()">✕ Remove</button>
            </div>
            <div id="chat-window"></div>
        </div>
        <div id="artifact-panel" class="artifact-panel hidden md:flex flex-col bg-[#faf6f0] border-l border-[#e3d7ca]">
            <div class="flex items-center justify-between px-4 py-2 border-b border-[#e3d7ca] shrink-0">
                <span class="text-sm font-semibold text-[#4d3e2e]">Artifacts</span>
                <button onclick="toggleArtifact()" class="text-gray-500 hover:text-gray-700">✕</button>
            </div>
            <div id="artifact-content" class="flex-1 p-3 overflow-y-auto">
                <div class="text-center text-[#a58b6e] text-sm mt-16">
                    <span class="text-3xl block mb-2">🎨</span>
                    HTML preview will appear here
                </div>
            </div>
        </div>
    </div>
</div>

<div class="bottom-bar">
    <div class="menu-wrapper">
        <button class="icon-btn" onclick="toggleMenu()" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
        <div id="menu-dropdown" class="menu-dropdown">
            <button onclick="triggerImageUpload()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H4a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                Select Photo
            </button>
            <button onclick="toggleWebSearch()" id="menu-search-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                Search
            </button>
            <button onclick="exportChat()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                Export
            </button>
            <div class="separator"></div>
            <button onclick="setMode('deep')" id="mode-deep">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                Deep Think
            </button>
            <button onclick="setMode('fast')" id="mode-fast">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6"/></svg>
                Fast
            </button>
        </div>
    </div>

    <div class="input-wrap">
        <input id="user-input" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendMessage();}" placeholder="Ask Stardust AI anything..." autocomplete="off">
    </div>

    <button class="icon-btn" onclick="voiceInput()" aria-label="Voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19a1 1 0 001-1v-1a1 1 0 00-2 0v1a1 1 0 001 1zm0 0c-3.866 0-7-3.134-7-7V9a1 1 0 112 0v3a5 5 0 1010 0V9a1 1 0 112 0v3c0 3.866-3.134 7-7 7z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5a3 3 0 00-3 3v4a3 3 0 006 0V8a3 3 0 00-3-3z"/></svg>
    </button>

    <button class="send-btn" id="send-btn" onclick="sendMessage()" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
    </button>
</div>

<input type="file" id="image-input" accept="image/*" class="hidden" onchange="handleImage(event)">

<script>
    // ===== CONFIG =====
    const CONFIG = {
        openrouterKey: "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",
        groqKey: "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"
    };

    // ===== STATE =====
    let chats = JSON.parse(localStorage.getItem('stardust_pro_chats')) || {};
    let currentChatId = null;
    let attachedImage = null;
    let attachedImageName = null;
    let isGenerating = false;
    let isStreaming = false;
    let webSearchEnabled = false;
    let currentArtifact = null;
    let isArtifactOpen = false;
    let currentMode = 'medium';
    let menuOpen = false;
    let renderLock = false;
    let pendingRender = false;
    let renderTimeout = null;
    let isImageMode = false;
    let streamAnimationFrame = null;

    // ===== IMAGE GENERATION =====
    function toggleImageMode() {
        isImageMode = !isImageMode;
        const btn = document.getElementById('image-mode-btn');
        btn.style.background = isImageMode ? '#a78b64' : 'transparent';
        btn.style.color = isImageMode ? 'white' : '#6b5a4a';
        document.getElementById('user-input').placeholder = isImageMode ? 'Describe image to generate...' : 'Ask Stardust AI anything...';
        const indicator = document.querySelector('.image-mode-indicator');
        if (isImageMode) {
            if (!indicator) {
                const span = document.createElement('span');
                span.className = 'image-mode-indicator';
                span.textContent = '🎨 Image Mode';
                document.querySelector('.fixed-header .flex.items-center.gap-1').appendChild(span);
            }
        } else {
            if (indicator) indicator.remove();
        }
    }

    function generateImageMarkdown(prompt) {
        if (!prompt || prompt.trim().length < 2) {
            return '⚠️ Please describe the image you want to generate.';
        }
        const seed = Math.floor(Math.random() * 1000000);
        const width = 1024;
        const height = 1024;
        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${width}&height=${height}&seed=${seed}&nologo=true`;
        
        return `🎨 **Image Generated**

![${prompt}](${imageUrl})

<div class="image-actions">
    <button onclick="window.open('${imageUrl}', '_blank')">📥 Download</button>
    <button onclick="copyText('${encodeURIComponent(imageUrl)}')">📋 Copy Link</button>
    <button onclick="regenerateImage('${encodeURIComponent(prompt)}')">🔄 Regenerate</button>
</div>
<div class="image-prompt-badge">✨ Prompt: ${prompt}</div>
<div class="image-prompt-badge">🔢 Seed: ${seed}</div>`;
    }

    function regenerateImage(prompt) {
        const decodedPrompt = decodeURIComponent(prompt);
        const chat = chats[currentChatId];
        if (!chat) return;
        for (let i = chat.messages.length - 1; i >= 0; i--) {
            if (chat.messages[i].role === 'ai' && chat.messages[i].text.includes('Image Generated')) {
                chat.messages[i].text = generateImageMarkdown(decodedPrompt);
                chat.messages[i]._parsed = false;
                saveChats();
                renderMessages(true);
                break;
            }
        }
    }

        if (!currentArtifact) return;

        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'artifact.html';
        a.click();
        URL.revokeObjectURL(a.href);

        const frame = document.getElementById('artifact-frame');
        if (frame?.requestFullscreen) frame.requestFullscreen();

    // ===== CHAT MANAGEMENT =====
    function newChat() {
        currentChatId = Date.now().toString();
        chats[currentChatId] = { id: currentChatId, title: 'New Conversation', messages: [], pinned: false };
        saveChats();
        renderHistory();
        renderMessages(true);
        closeSidebar();
    }

    function loadChat(id) {
        if (isGenerating) return;
        currentChatId = id;
        renderMessages(true);
        renderHistory();
        closeSidebar();
    }

    function deleteChat(id, e) {
        e?.stopPropagation();
        if (!confirm('Delete this conversation?')) return;
        delete chats[id];
        saveChats();
        renderHistory();
        const keys = Object.keys(chats);
        if (keys.length) loadChat(keys[keys.length - 1]);
        else newChat();
    }

    function renameChat(id) {
        const newName = prompt('Rename:', chats[id]?.title || '');
        if (newName?.trim()) { chats[id].title = newName.trim(); saveChats(); renderHistory(); renderMessages(); }
    }

    function pinChat(id, e) {
        e?.stopPropagation();
        chats[id].pinned = !chats[id].pinned;
        saveChats();
        renderHistory();
    }

    function saveChats() {
        localStorage.setItem('stardust_pro_chats', JSON.stringify(chats));
    }

    function filterHistory(query) {
        document.querySelectorAll('#history-list .history-item').forEach(item => {
            item.style.display = item.textContent.toLowerCase().includes(query.toLowerCase()) ? 'flex' : 'none';
        });
    }

    // ===== RENDER HISTORY =====
    function renderHistory() {
        const container = document.getElementById('history-list');
        if (!container) return;
        container.innerHTML = '';
        const sorted = Object.keys(chats).sort((a, b) => {
            if (chats[a].pinned && !chats[b].pinned) return -1;
            if (!chats[a].pinned && chats[b].pinned) return 1;
            return b - a;
        });
        document.getElementById('chat-count').textContent = sorted.length;
        sorted.forEach(id => {
            const chat = chats[id];
            const div = document.createElement('div');
            div.className = `history-item flex items-center justify-between px-3 py-2 rounded-xl transition ${id == currentChatId ? 'bg-[#e3d7ca] shadow-sm' : 'hover:bg-[#ede8e2]'}`;
            div.innerHTML = `
                <span class="flex-1 truncate text-sm font-medium cursor-pointer" onclick="loadChat('${id}')">${chat.pinned ? '📌 ' : ''}${chat.title}</span>
                <div class="flex gap-1.5">
                    <button onclick="pinChat('${id}', event)" class="text-[10px] text-[#a58b6e] hover:text-[#5c4b37] p-1 hover:bg-white/50 rounded transition">📌</button>
                    <button onclick="renameChat('${id}')" class="text-[10px] text-[#a58b6e] hover:text-[#5c4b37] p-1 hover:bg-white/50 rounded transition">✎</button>
                    <button onclick="deleteChat('${id}', event)" class="text-[10px] text-red-300 hover:text-red-500 p-1 hover:bg-white/50 rounded transition">✕</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    // ===== RENDER MESSAGES =====
    function renderMessages(scrollToBottom = false) {
        if (renderLock) {
            pendingRender = true;
            return;
        }
        renderLock = true;
        
        if (renderTimeout) {
            cancelAnimationFrame(renderTimeout);
            renderTimeout = null;
        }

        renderTimeout = requestAnimationFrame(() => {
            const win = document.getElementById('chat-window');
            const chat = chats[currentChatId];
            
            if (!chat || !chat.messages || !chat.messages.length) {
                win.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-[#a58b6e] text-center px-4">
                        <div class="text-5xl mb-3">✨</div>
                        <span class="text-lg font-semibold text-[#4d3e2e]">Stardust AI</span>
                        <span class="text-sm max-w-sm mt-1">Your intelligent assistant. Ask me anything.</span>
                        <div class="flex gap-2 mt-4 flex-wrap justify-center">
                            <button onclick="setInput('Explain quantum computing')" class="text-xs bg-white/60 px-3 py-1.5 rounded-full border border-[#d0c4b6] hover:bg-white transition">Quantum</button>
                            <button onclick="setInput('Write a Python function')" class="text-xs bg-white/60 px-3 py-1.5 rounded-full border border-[#d0c4b6] hover:bg-white transition">Code</button>
                            <button onclick="setInput('Create a login page with HTML/CSS')" class="text-xs bg-white/60 px-3 py-1.5 rounded-full border border-[#d0c4b6] hover:bg-white transition">Login Page</button>
                            <button onclick="setInput('Generate image of a beautiful sunset')" class="text-xs bg-white/60 px-3 py-1.5 rounded-full border border-[#d0c4b6] hover:bg-white transition">🎨 Image</button>
                        </div>
                    </div>
                `;
                renderLock = false;
                return;
            }

            const wasAtBottom = win.scrollHeight - win.scrollTop - win.clientHeight < 100;
            
            let html = '';
            const messages = chat.messages;
            
            for (let idx = 0; idx < messages.length; idx++) {
                const msg = messages[idx];
                const isUser = msg.role === 'user';
                const isLastAI = !isUser && idx === messages.length - 1;
                const isThinking = isLastAI && isStreaming && !msg.text;
                const isComplete = isLastAI && msg.text && !isStreaming;
                
                const avatar = isUser ?
                    `<div class="h-7 w-7 rounded-full bg-gradient-to-br from-[#b7a28b] to-[#a58b6e] flex items-center justify-center text-white text-[10px] font-bold shadow-sm shrink-0">U</div>` :
                    `<img src="./logo.png" class="h-7 w-7 rounded-full object-cover border-2 border-[#d0c4b6] shadow-sm shrink-0" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2228%22 height=%2228%22%3E%3Crect width=%2228%22 height=%2228%22 rx=%228%22 fill=%22%23b7a28b%22/%3E%3Ctext x=%2214%22 y=%2220%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2212%22 font-weight=%22bold%22%3ESD%3C/text%3E%3C/svg%3E'">`;

                let displayContent = '';
                let content = msg.text || '';
                
                if (isThinking) {
                    displayContent = `
                        <div class="thinking-wrapper">
                            <span class="thinking-text">Stardust AI is thinking</span>
                            <div class="thinking-dots"><span></span><span></span><span></span></div>
                            <span class="typing-cursor"></span>
                        </div>
                    `;
                } else if (content) {
                    if (!isUser) {
                        if (!msg._parsed) {
                            content = marked.parse(content);
                            msg._parsed = true;
                            msg._html = content;
                        }
                        content = msg._html || content;
                        content = addCodeToolbars(content);
                        if (content.includes('<html') || content.includes('<!DOCTYPE html>')) {
                            const htmlMatch = content.match(/<html[\s\S]*?<\/html>/i) || content.match(/<!DOCTYPE html>[\s\S]*?<\/html>/i);
                            if (htmlMatch && !isArtifactOpen && !isStreaming) {
                                setTimeout(() => showArtifact(htmlMatch[0]), 300);
                            }
                        }
                    }
                    displayContent = isUser ? `<span>${msg.text}</span>` : content;
                }

                const imgHtml = msg.img ? `<img src="${msg.img}" class="max-h-40 max-w-full rounded-xl shadow-sm mb-2 object-cover border border-[#d0c4b6]">` : '';

                const showActions = !isUser && msg.text && !isStreaming;
                const actionsHtml = showActions ? `
                    <div class="msg-actions visible flex gap-1.5 mt-2 text-[10px] text-[#a58b6e] flex-wrap">
                        <button onclick="copyText('${encodeURIComponent(msg.text)}')" class="hover:bg-[#ede8e2] px-2 py-1 rounded-lg transition">📋 Copy</button>
                        <button onclick="regenerateMessage(${idx})" class="hover:bg-[#ede8e2] px-2 py-1 rounded-lg transition">↻ Regenerate</button>
                        <button onclick="speakMessage('${encodeURIComponent(msg.text)}')" class="hover:bg-[#ede8e2] px-2 py-1 rounded-lg transition">🔊 Listen</button>
                    </div>
                ` : `<div class="msg-actions ${isComplete ? 'visible' : ''}"></div>`;

                html += `
                    <div class="flex ${isUser ? 'justify-end' : 'justify-start'} mb-3 fade-in" data-msg-index="${idx}">
                        <div class="flex items-start gap-2.5 max-w-[90%] ${isUser ? 'flex-row-reverse' : ''}">
                            ${avatar}
                            <div class="${isUser ? 'bg-gradient-to-br from-[#b7a28b] to-[#a58b6e] text-white rounded-2xl rounded-tr-none' : 'bg-white/80 glass-panel text-[#3d3228] rounded-2xl rounded-tl-none'} px-4 py-2.5 shadow-sm message-ai" style="max-width: 100%;">
                                ${imgHtml}
                                <div class="msg-text-content text-sm leading-relaxed ${!isUser && !isThinking ? 'streaming-text' : ''}">${displayContent}</div>
                                ${actionsHtml}
                            </div>
                        </div>
                    </div>
                `;
            }

            if (win.innerHTML !== html) {
                win.innerHTML = html;
            }
            
            document.querySelectorAll('.msg-text-content pre code').forEach(block => hljs.highlightElement(block));

            if (scrollToBottom || wasAtBottom) {
                win.scrollTop = win.scrollHeight;
            }
            
            renderLock = false;
            renderTimeout = null;
            
            if (pendingRender) {
                pendingRender = false;
                renderMessages(scrollToBottom);
            }
        });
    }

    function addCodeToolbars(html) {
        return html.replace(/<pre><code class="language-(\w+)">([\s\S]*?)<\/code><\/pre>/g, (match, lang, code) => {
            const langDisplay = {
                javascript: 'JS', python: 'Python', html: 'HTML', css: 'CSS',
                json: 'JSON', bash: 'Bash', typescript: 'TS', xml: 'XML', sql: 'SQL'
            }[lang] || lang.toUpperCase();
            return `<div class="code-block-wrapper" data-lang="${lang}">
                <div class="code-toolbar">
                    <span>${langDisplay}</span>
                    <button class="copy-code-btn">📋 Copy</button>
                    <button class="download-code-btn">⬇ Download</button>
                    <button class="run-code-btn">▶ Run</button>
                </div>
                <pre><code class="language-${lang}">${code}</code></pre>
            </div>`;
        });
    }

    // ===== UPDATE STREAMING MESSAGE =====
    function updateStreamingMessage(fullText) {
        if (streamAnimationFrame) {
            cancelAnimationFrame(streamAnimationFrame);
            streamAnimationFrame = null;
        }
        
        streamAnimationFrame = requestAnimationFrame(() => {
            const win = document.getElementById('chat-window');
            const messages = win.querySelectorAll('[data-msg-index]');
            const lastMsg = messages[messages.length - 1];
            
            if (lastMsg) {
                const contentDiv = lastMsg.querySelector('.msg-text-content');
                if (contentDiv) {
                    contentDiv.textContent = fullText;
                    const thinkingWrapper = contentDiv.querySelector('.thinking-wrapper');
                    if (thinkingWrapper) {
                        thinkingWrapper.remove();
                    }
                    
                    if (win.scrollHeight - win.scrollTop - win.clientHeight < 150) {
                        win.scrollTop = win.scrollHeight;
                    }
                }
            }
            streamAnimationFrame = null;
        });
    }

    // ===== SEND MESSAGE =====
    async function sendMessage() {
        if (isGenerating) return;
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text && !attachedImage) {
            alert('Please enter a message or attach an image.');
            return;
        }
        input.value = '';

        if (!currentChatId || !chats[currentChatId]) {
            newChat();
        }

        const chat = chats[currentChatId];
        if (!chat) return;

        // IMAGE MODE - Generate image directly
        if (isImageMode) {
            const userMsg = { role: 'user', text: text || 'Generate an image', img: attachedImage || null, _parsed: false };
            chat.messages.push(userMsg);
            if (chat.title === 'New Conversation' && text) {
                chat.title = text.slice(0, 30) + (text.length > 30 ? '...' : '');
            }
            saveChats();
            renderMessages(true);
            
            const imageResult = generateImageMarkdown(text || 'beautiful landscape');
            const aiMsg = { role: 'ai', text: imageResult, _parsed: false };
            chat.messages.push(aiMsg);
            saveChats();
            renderMessages(true);
            renderHistory();
            clearImage();
            return;
        }

        // NORMAL CHAT - with image if attached
        const userMsg = { role: 'user', text: text, img: attachedImage || null, _parsed: false };
        chat.messages.push(userMsg);
        if (chat.title === 'New Conversation' && text) {
            chat.title = text.slice(0, 30) + (text.length > 30 ? '...' : '');
        }
        saveChats();
        renderMessages(true);
        
        // Store image for API context
        const imgPayload = attachedImage;
        const imgName = attachedImageName;
        clearImage();

        const aiMsg = { role: 'ai', text: '', _parsed: false };
        chat.messages.push(aiMsg);
        const msgIndex = chat.messages.length - 1;
        
        isGenerating = true;
        isStreaming = true;
        
        const sendBtn = document.getElementById('send-btn');
        sendBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>`;
        sendBtn.onclick = stopGeneration;

        renderMessages(true);

        try {
            const lengthMap = { short: 300, medium: 700, long: 1200, xlong: 2000 };
            const maxTokens = lengthMap[currentMode] || 700;

            const isHindi = /[\u0900-\u097F]/.test(text);
            const isHinglish = /(hai|hain|ho|hum|aap|kya|kaise|kyu|nahi|haan|ji|bhai|yaar|dost|sahi|galat|acha|theek)/i.test(text);
            const langInstruction = isHindi ? 'Respond in Hinglish/Hindi with Devanagari or Roman script.' : 
                                     isHinglish ? 'Respond in Hinglish (Hindi + English mix).' : 
                                     'Respond in English.';

            const systemPrompt = `You are Stardust AI, a world-class intelligent assistant. 
${langInstruction}
Be helpful, accurate, and concise. Use markdown for formatting. 
If the user asks for code, provide clean, well-commented code.
If the user asks for explanation, break it down simply.
Adapt your tone and style to match the user's language and intent.
Always be professional and friendly.`;

            const searchContext = webSearchEnabled ? ' If user asks for current/latest info, provide updated context. ' : '';

            let userContent = text || '';
            if (imgPayload) {
                userContent += `\n\n[User attached an image: ${imgName || 'image'}]`;
            }

            // Build messages for API
            const apiMessages = [
                { role: 'system', content: systemPrompt + searchContext }
            ];

            // Add last 10 messages (excluding the empty AI message we just added)
            const historyMessages = chat.messages.slice(-11, -1).filter(m => m.text);
            for (const m of historyMessages) {
                apiMessages.push({
                    role: m.role === 'user' ? 'user' : 'assistant',
                    content: m.text || ''
                });
            }

            // Update the last user message with image context
            if (apiMessages.length > 0 && apiMessages[apiMessages.length - 1].role === 'user') {
                apiMessages[apiMessages.length - 1].content = userContent;
            }

            const apiUrl = 'https://openrouter.ai/api/v1/chat/completions';
            const payload = {
                model: 'meta-llama/llama-3.2-3b-instruct',
                messages: apiMessages,
                max_tokens: maxTokens,
                temperature: 0.7,
                top_p: 0.9,
                stream: true
            };

            const resp = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${CONFIG.openrouterKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!resp.ok) {
                const errData = await resp.json().catch(() => ({}));
                throw new Error(errData.error?.message || `API Error: ${resp.status}`);
            }

            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullText = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    if (line.trim() === '' || line.trim() === 'data: [DONE]') continue;
                    if (line.startsWith('data: ')) {
                        try {
                            const json = JSON.parse(line.slice(6));
                            const delta = json.choices?.[0]?.delta?.content || '';
                            if (delta) {
                                fullText += delta;
                                chat.messages[msgIndex].text = fullText;
                                updateStreamingMessage(fullText);
                            }
                        } catch (e) {}
                    }
                }
            }

            chat.messages[msgIndex].text = fullText || '⚠️ No response received.';
            chat.messages[msgIndex]._parsed = false;
            isStreaming = false;
            saveChats();
            renderMessages(true);

        } catch (error) {
            chat.messages[msgIndex].text = `⚠️ Error: ${error.message || 'Something went wrong.'}`;
            chat.messages[msgIndex]._parsed = false;
            isStreaming = false;
            saveChats();
            renderMessages(true);
        }

        isGenerating = false;
        isStreaming = false;
        sendBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>`;
        sendBtn.onclick = sendMessage;
        renderHistory();
    }

    function stopGeneration() {
        isGenerating = false;
        isStreaming = false;
        const sendBtn = document.getElementById('send-btn');
        sendBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>`;
        sendBtn.onclick = sendMessage;
    }

    function regenerateMessage(idx) {
        if (isGenerating) return;
        const chat = chats[currentChatId];
        if (!chat || idx < 0) return;
        chat.messages = chat.messages.slice(0, idx);
        chat.messages.forEach(m => m._parsed = false);
        saveChats();
        renderMessages();
        const lastUser = chat.messages[chat.messages.length - 1];
        if (lastUser && lastUser.role === 'user') {
            attachedImage = lastUser.img || null;
            if (attachedImage) {
                const container = document.getElementById('image-preview-container');
                const preview = document.getElementById('image-preview');
                preview.src = attachedImage;
                container.classList.add('show');
                container.style.display = 'flex';
            }
            document.getElementById('user-input').value = lastUser.text || '';
            sendMessage();
        }
    }

    // ===== EXPORT =====
    function exportChat() {
        const chat = chats[currentChatId];
        if (!chat?.messages?.length) return alert('No messages to export.');
        let text = `# Stardust AI Export\n# ${new Date().toLocaleString()}\n\n`;
        chat.messages.forEach(msg => {
            text += msg.role === 'user' ? `**User:** ${msg.text}\n\n` : `**Stardust AI:** ${msg.text}\n\n`;
        });
        const blob = new Blob([text], { type: 'text/markdown' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `chat-export-${Date.now()}.md`;
        a.click();
        URL.revokeObjectURL(a.href);
        closeMenu();
    }

    // ===== UTILITIES =====
    function copyText(encoded) {
        const text = decodeURIComponent(encoded);
        navigator.clipboard?.writeText(text).then(() => alert('✅ Copied!')).catch(() => {});
    }

    function speakMessage(encoded) {
        const text = decodeURIComponent(encoded);
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'hi-IN';
        utterance.rate = 0.9;
        speechSynthesis.speak(utterance);
    }

    function voiceInput() {
        if (!('webkitSpeechRecognition' in window)) return alert('Voice not supported.');
        const rec = new webkitSpeechRecognition();
        rec.lang = 'hi-IN';
        rec.onresult = e => document.getElementById('user-input').value = e.results[0][0].transcript;
        rec.start();
    }

    function setInput(text) {
        document.getElementById('user-input').value = text;
        document.getElementById('user-input').focus();
    }

    function handleImage(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            attachedImage = ev.target.result;
            attachedImageName = file.name;
            const preview = document.getElementById('image-preview');
            const container = document.getElementById('image-preview-container');
            const fileName = document.getElementById('image-file-name');
            preview.src = attachedImage;
            fileName.textContent = file.name;
            container.classList.add('show');
            container.style.display = 'flex';
        };
        reader.readAsDataURL(file);
        e.target.value = '';
        closeMenu();
    }

    function clearImage() {
        attachedImage = null;
        attachedImageName = null;
        const container = document.getElementById('image-preview-container');
        container.classList.remove('show');
        container.style.display = 'none';
        document.getElementById('image-input').value = '';
        document.getElementById('image-preview').src = '';
        document.getElementById('image-file-name').textContent = '';
    }

    // ===== INIT =====
    function init() {
        chats = JSON.parse(localStorage.getItem('stardust_pro_chats')) || {};
        
        if (!Object.keys(chats).length) {
            newChat();
        } else {
            const ids = Object.keys(chats).sort((a, b) => b - a);
            currentChatId = ids[0];
            renderMessages(true);
            renderHistory();
        }

        document.addEventListener('click', function(e) {
            const target = e.target.closest('.copy-code-btn');
            if (target) {
                const code = target.closest('.code-block-wrapper')?.querySelector('code')?.textContent || '';
                navigator.clipboard?.writeText(code).then(() => {
                    const orig = target.innerHTML;
                    target.innerHTML = '✅ Copied!';
                    setTimeout(() => target.innerHTML = orig, 1200);
                }).catch(() => {});
            }
            
            const downloadBtn = e.target.closest('.download-code-btn');
            if (downloadBtn) {
                const wrapper = downloadBtn.closest('.code-block-wrapper');
                const code = wrapper?.querySelector('code')?.textContent || '';
                const lang = wrapper?.dataset.lang || 'txt';
                const extMap = { javascript: 'js', python: 'py', html: 'html', css: 'css', json: 'json', bash: 'sh', typescript: 'ts', xml: 'xml', sql: 'sql' };
                const ext = extMap[lang] || 'txt';
                const blob = new Blob([code], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `code.${ext}`;
                a.click();
                URL.revokeObjectURL(a.href);
            }

            const runBtn = e.target.closest('.run-code-btn');
            if (runBtn) {
                const wrapper = runBtn.closest('.code-block-wrapper');
                const code = wrapper?.querySelector('code')?.textContent || '';
                const lang = wrapper?.dataset.lang || 'html';
                if (lang === 'html' || lang === 'xml') {
                    showArtifact(code);
                } else {
                    alert('Live preview only for HTML code.');
                }
            }
        });

        document.getElementById('artifact-panel').style.display = 'none';
        isArtifactOpen = false;
        
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.bottom-bar')) {
                closeMenu();
            }
        });
        
        // Hide image preview container initially
        document.getElementById('image-preview-container').style.display = 'none';
    }

    window.onload = init;
</script>
</body>
</html>
